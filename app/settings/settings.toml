# Modo desenvolvimento: acessa arquivos remotos via SSH/SFTP
RUN_FOR_SFTP = true

# Configurações do servidor remoto meteo-ampere-01
HOSTNAME_REMOTE = "152.67.34.247"
USER_SSH = "ubuntu"
PORT_SSH = 22
SSH_KEY_PATH = "@jinja {{env.HOME}}/.ssh/meteorologia-oracle-sp.pem"

# Mapeamento de diretórios remotos
REMOTE_DIR_DADOS = "/home/ubuntu/meteorologia/campos-observados/dados"
REMOTE_DIR_INPUT = "/home/ubuntu/meteorologia/campos-observados/Entrada"
REMOTE_DIR_OUTPUT = "/home/ubuntu/meteorologia/campos-observados/Saida"

# Configurações específicas de desenvolvimento
SERVER_ALIVE_INTERVAL = 120  # Keep-alive SSH em segundos

[qa]
LEVEL_LOGGING = "DEBUG"
SFTP_ENABLED = false
LOGGER_BACKTRACE = true
