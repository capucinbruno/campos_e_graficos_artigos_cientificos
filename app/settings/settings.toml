# do 1º nível (1 mm) fica TRANSPARENTE (extend='max' não preenche → área seca revela o fundo). 6
# bandas discretas (1 cor/banda). Faixas: <25 / 25–50 / 50–75 / 75–125 / 125–200 / 200–300 mm.
# 11 faixas: <25, 25-50, 50-75, 75-125, 125-200, 200-250, 250-300, 300-350, 350-400, 400-450, 450-500 (e >500 = último cinza)
