# ── 5h. Ícones de pressão animados  (s38–s41) ────────────────────────────
# GIFs de Entrada/icones_pressao/ ancorados em lat/lon do globo.
# Renderizados respeitando a curvatura e o limbo (área escura de borda do globo), com
# dimensionamento em graus de arco — igual ao tratamento do jet stream.
#
# GIFs disponíveis (nome sem extensão .gif):
#   ALTA_HS / ALTA_HN    — alta pressão (HS = hemisfério sul, HN = norte)
#   BAIXA_HS / BAIXA_HN  — baixa pressão
#   HIGH_HS / HIGH_HN    — versão em inglês do ALTA (mesma física)
#   LOW_HS / LOW_HN      — versão em inglês do BAIXA
#   INTERROGACAO_AZUL_ANTIHORARIO / INTERROGACAO_AZUL_HORARIO
#   INTERROGACAO_VERMELHO_ANTIHORARIO / INTERROGACAO_VERMELHO_HORARIO
#
# Campos por ícone:
#   tipo        — nome do arquivo sem .gif (ex.: "ALTA_HS")
#   lat / lon   — ponto central do ícone no globo (graus; lon negativa = Oeste)
#   velocidade  — velocidade de reprodução do GIF em relação ao vídeo (1.0 = normal; 2.0 = dobro)
#   tamanho_deg — diâmetro do ícone em graus de arco do globo (escala correta na curvatura e limbo)
#   alpha       — opacidade do ícone (0–1; default 1.0)
#   sombra      — true = halo de sombra difusa ao redor do ícone
#   sombra_dx   — deslocamento lon da sombra (graus; positivo = leste)
#   sombra_dy   — deslocamento lat da sombra (graus; positivo = norte; negativo = sul)
#   sombra_alpha — opacidade da sombra (0–1; default 0.35)
#   fade_in      — true = aparece com fade-in (default false = aparece direto, opaco)
#   fade_inicio  — fração do clipe (0–1) em que o fade começa (default 0.0)
#   fade_duracao — duração do fade em fração do clipe (default 0.15)
# Zorder: o ícone SEMPRE fica abaixo da corrente de jato quando ela está ligada (o jato nunca
# fica escondido atrás de um ícone); sem jato, o ícone fica no topo do mapa como antes.
GLOBO_3D_ICONES_PRESSAO = []   # lista vazia = sem ícones; adicione entradas no settings.local.toml
# regrid_shape do cartopy imshow() do ícone: se aplica ao EXTENT INTEIRO do globo visível, não só
# ao extent do ícone -- por isso precisa ser alto (mesma ordem do GLOBO_3D_JATO_DRAPE_REGRID) mesmo
# o ícone ocupando só alguns graus da tela. Baixo demais = ícone serrilhado/pixelado.
GLOBO_3D_ICONE_PRESSAO_REGRID = 2048
# Recolore o AZUL dos icones de ALTA pressao (HIGH_HN/HS, ALTA_HN/HS -- os de BAIXA/vermelhos nao
