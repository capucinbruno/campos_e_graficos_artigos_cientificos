GLOBO_3D_PCOLORMESH_PRECIP_ABS = false

# false (default) = chuva acumulada DIÁRIA (1 frame/dia, pipeline de sempre). true = troca pro passo
# NATIVO do modelo (ECMWF: 3h até 144h, 6h daí em diante; GFS: 6h fixo, os buckets do APCP) -- anima
