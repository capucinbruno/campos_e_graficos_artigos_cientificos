# ══════════════════════════════════════════════════════════════════════════════
# app/settings/settings.toml  —  DEFAULTS GLOBAIS (master)
# ══════════════════════════════════════════════════════════════════════════════
# Valores padrão para TODOS os ambientes. Sobrescreva em settings.local.toml
# (gitignored) ou nas seções [development] / [production] ao final do arquivo.
# ══════════════════════════════════════════════════════════════════════════════

[default]


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  1. SISTEMA  (diretórios, logging, SFTP)                                │
# └─────────────────────────────────────────────────────────────────────────┘
CURRENT_ENV = "@jinja {{this.current_env | lower}}"   # "development" ou "production"
HOME_DIR    = "@jinja {{env.HOME}}"                   # home do usuário (via Jinja)

DIR_DADOS    = "dados"             # dados baixados do CDS (.nc/.grb)
DIR_FILE_NC  = "Entrada/arquivos_nc"
DIR_INPUT    = "Entrada"           # arquivos fixos (logos, legendas, climatologias)
DIR_OUTPUT   = "Saida"             # mapas e vídeos gerados
DIR_LOGS     = "logs"              # logs da aplicação

LEVEL_LOGGING    = "INFO"          # nível de log: "DEBUG" | "INFO" | "WARNING"
LOGGER_BACKTRACE = false           # mostra traceback completo nos logs
LOGGER_DIAGNOSE  = false           # diagnóstico detalhado do Loguru

SFTP_ENABLED = false               # habilita SFTP para buscar arquivos de suporte
RUN_FOR_SFTP = false               # alias legado — use SFTP_ENABLED


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  2. DATAS  (sobrescreva em settings.local.toml)                         │
# └─────────────────────────────────────────────────────────────────────────┘
# Usadas apenas em MODE="reanalysis". O CLI (--data-inicial / --data-final)
# tem precedência sobre estas chaves.
# O ERA5 tem ~5 dias de atraso — DATA_FINAL muito recente gera erro no CDS.
DATA_INICIAL = ""   # formato YYYY-MM-DD; vazio = obrigatório via CLI ou settings.local
DATA_FINAL   = ""   # formato YYYY-MM-DD; vazio = obrigatório via CLI ou settings.local


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  3. QUAIS SCRIPTS RODAR  (--all)                                        │
# └─────────────────────────────────────────────────────────────────────────┘
# true = habilitado (padrão). Para desabilitar, ponha false no settings.local.toml.
RUN_S00 = true   # Anomalia Geopotencial 850 hPa (ERA5/GDAS + PSL)
RUN_S01 = true   # Anomalia Geopotencial 500 hPa (ERA5/GDAS + PSL)
RUN_S02 = true   # Anomalia Geopotencial 250 hPa (ERA5/GDAS + PSL)
RUN_S03 = true   # Anomalia CHI200 (Velocity Potential)
RUN_S04 = true   # Anomalia PSI200 (Streamfunction)
RUN_S05 = true   # Anomalia OLR (PSL/NOAA)
RUN_S06 = true   # Anomalia OLR + Vento 250 e 850 hPa (streamlines)
RUN_S07 = true   # Rossby Wave Activity Flux + Anomalia Geopotencial 250 hPa
RUN_S08 = true   # Rossby Wave Activity Flux + Anomalia OLR
RUN_S09 = true   # Rossby Wave Activity Flux + Anomalia TSM
RUN_S10 = true   # Rossby Wave Activity Flux + Anomalia Temperatura 850 hPa
RUN_S11 = true   # Anomalia TSM — todas as áreas (OISSTv2/NOAA)
RUN_S12 = true   # Anomalia TSM + Vento 850 hPa — todas as áreas
RUN_S13 = true   # Média de TSM (OISSTv2) + Vento médio 1000 hPa
RUN_S14 = true   # Anomalia TSM + Vento 850 hPa (streamlines) + Anomalia OLR
RUN_S15 = true   # CHI200 (shaded + vento div.) + PSI200 (contour)
RUN_S16 = true   # Anomalia Vento Zonal 250 hPa + Vento Divergente 200 hPa
RUN_S17 = true   # Anomalia Vento Meridional 250 hPa
RUN_S18 = true   # Anomalia Temperatura 850 hPa + Vento 850 hPa
RUN_S19 = true   # Anomalia Temperatura 850 hPa + Vento 850 hPa + Geopotencial 500 hPa
RUN_S20 = true   # Anomalia OLR + Vento 850 hPa + Geopotencial 500 hPa
RUN_S21 = true   # Anomalia CHI200 + Streamlines 850 hPa + Vento divergente 200 hPa
RUN_S22 = true   # Anomalia OLR + Streamlines 850 hPa + Vento divergente 200 hPa
RUN_S23 = true   # Média de TSM (OISSTv2) + Correntes Marinhas de Superfície (CMEMS)
RUN_S24 = true   # Anomalia TSM Global + Índices (ENSO, IOD, AMO, TNA, TSA, SAD, PDO)
RUN_S25 = true   # OLR + Geop250 + WAF + Vento Divergente chi200<0
RUN_S26 = true   # chi200 + Geop250 + WAF + Vento Divergente chi200<0
RUN_S27 = true   # Hovmoller TSM + U850 (ENSO belt 5S–5N, 160E–80W)
RUN_S28 = true   # Hovmoller TSM + U850 (IOD belt 5S–5N, 50E–103E)
RUN_S29 = true   # Célula de Walker: anomalia omega 30S–30N (ERA5 vs PSL clim)
RUN_S30 = true   # Média de TSM por área, sem vento e sem OLR
RUN_S31 = true   # CHI200 intrasazonal (MJO) — pentadas + Hovmoller (método CPC)
RUN_S32 = true   # OLR intrasazonal (MJO) — pentadas + Hovmoller (método CPC)
RUN_S33 = true   # Hovmoller TSM + U850 (caixa livre lat/lon via settings)
RUN_S34 = true   # Guia de onda de Rossby — Ks 200 hPa + Z200 + WAF (Hoskins/Ambrizzi)
RUN_S35 = true   # Índice AAO (Antarctic Oscillation) — observado + previsões multi-modelo
RUN_S36 = true   # Índice MJO (diagrama de fase RMM1×RMM2) — observado + previsões
RUN_S37 = true   # Frequência de frentes frias por localidade (heatmap)
RUN_S38 = true   # Globo 3D animado estilo Ben Noll (MP4)
RUN_S39 = true   # Globo 3D animado estilo Guillaume Jauseau (MP4)
RUN_S40 = true   # Globo 3D ESTATICO (PNGs: diario/media movel/pentadas/media total)
RUN_S41 = true   # Globo 3D animado padrao Google Earth (MP4; copia do s39, projecao ampliada)
RUN_S42 = true   # Globo 3D animado estilo The Weather Channel (MP4; copia do s41, em evolucao)
RUN_S43 = true   # Mapa 2D plano estilo The Weather Channel (MP4; irmao do s42, sem globo)
RUN_S44 = true   # Globo 3D INCLINADO ("deitado", MP4; copia do s39 com enquadramento inclinado)
RUN_S45 = true   # Mapa global 2D estilo s39 (MP4; Pacifico ao centro, sem voo de camera)
RUN_S46 = true   # Globo 3D INCLINADO de CHUVA multi-modelos (MP4; config no topo do proprio script)
RUN_S47 = true   # Globo 3D INCLINADO de RAJADAS de vento (MP4; so ECMWF; config no topo do script)
RUN_S48 = true   # Globo 3D INCLINADO de PRECIPITACAO INVERNAL (MP4; copia do s46; config propria)
RUN_S49 = true   # Globo 3D INCLINADO de CHUVA OBSERVADA (MP4; MERGE/CPTEC + IMERG/NASA; config propria)


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  4. MODO DE DADOS E MODELOS DE PREVISÃO                                 │
# └─────────────────────────────────────────────────────────────────────────┘
# "reanalysis" usa DATA_INICIAL/DATA_FINAL (ERA5/GDAS).
# "forecast"   baixa o(s) modelo(s) habilitado(s) abaixo a partir de FORECAST_INIT.
MODE = "reanalysis"

# Modelos disponíveis — habilite um ou mais quando MODE="forecast":
RUN_GFS       = true    # GFS deterministico 0.25° (NOMADS) — ~16 d
RUN_GEFS      = false   # GEFS média do ensemble 0.5° (NOMADS) — até 35 d
RUN_ECMWF     = false   # ECMWF HRES 0.25° (Open Data) — ~10 d
RUN_ECMWF_ENS = false   # ECMWF ENS 50 membros (PESADO) — ~15 d
RUN_AIFS      = false   # IA determinística ECMWF 15 d (SEM OLR)
RUN_AIFS_ENS  = false   # IA ensemble ECMWF 50 membros (SEM OLR, PESADO)
RUN_AIGFS     = false   # IA determinística NCEP 16 d (SEM OLR)
RUN_AIGEFS    = false   # IA ensemble NCEP média pronta 16 d (SEM OLR, LEVE)
RUN_CFS       = false   # CFS pseudo-ensemble subsazonal ~45 d (SEM T850/Z250)

# Controle da rodada de previsão:
FORECAST_INIT = ""              # "" / "latest" = hoje; "YYYY-MM-DD" = rodada antiga
RODADA        = "00"            # hora do ciclo: "00", "06", "12" ou "18" (UTC)

# Horizonte e paralelismo:
GEFS_FORECAST_LEAD_DAYS = 35    # GEFS: 15 = rodada hoje 00Z; 35 = D-1 00Z (ciclo estendido)
DOWNLOAD_WORKERS        = 6     # dias de previsão baixados em paralelo (cuidado com NOMADS)
ECMWF_ENS_MEMBERS       = 50    # membros do ENS a mediar (reduza para acelerar; 20 ~ ok)
ECMWF_ENS_WORKERS       = 32    # downloads de membros em paralelo (ECMWF S3 escala bem)

# CFS (subsazonal):
CFS_LEAD_DAYS = 45              # horizonte do CFS (janela NCICS = 16 membros × 4 ciclos)
CFS_WORKERS   = 8               # downloads de membros do CFS em paralelo (não exagerar)

# s31 forecast (CHI200 intrasazonal): GEFS (35d) e CFS (45d) rodam automaticamente.
FORECAST_MAP_WINDOWS = [1, 2, 3, 5, 7, 10]   # janelas (dias) dos mapas espaciais do s31 forecast
NUM_RODADA           = 1                       # rodadas diárias consecutivas (lagged ensemble)

# s34 forecast: pentadas fixas geradas a partir do dia seguinte à rodada.
# Deixe ausente para herdar N_PENTADAS. Descomente APENAS se quiser valor diferente do s31.
# N_PENTADAS_FIXAS = 3

# Janela móvel (dias) dos mapas espaciais do s34 (Ks/RWS/WAF/Z200). 0 = período inteiro.
MOV_AVG_DAYS = 5


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  5. GLOBO 3D ANIMADO  (s38 Ben Noll / s39 Guillaume Jauseau)           │
# └─────────────────────────────────────────────────────────────────────────┘
# Gera 1 MP4 por variável. Modo é automático pelas datas: passado = reanalise,
# futuro = previsão, janela que cruza hoje = emenda observado + previsão.

# ── 5a. Variáveis ────────────────────────────────────────────────────────
# Campos disponíveis — comente/descomente para incluir ou excluir do plot:
#   z250_anom                     – anomalia de Z250 em shaded (gera tb a média móvel de 5 dias)
#   psi200_anom                   – anomalia de PSI200 em shaded
#   chi200_anom                   – anomalia de CHI200 em shaded
#   chi200_cores_psi200_contornos – CHI200 em shaded + PSI200 em contorno (pêntada móvel 5d)
#   chi200_cores_z250_contornos   – CHI200 em shaded + Z250 anom em contorno (pêntada móvel 5d)
#   tmp850_anom                   – anomalia de temperatura do ar em 850 hPa
#   tmp850_mslp                   – anomalia de temperatura em 850 hPa + PNMM em contorno
#   tmp850_cores_psi200_contornos – T850 em shaded + PSI200 em contorno (pêntada móvel 5d)
#   jet_stream                    – magnitude do vento em 250 hPa (corrente de jato)
#   jet_stream_psi200_contour     – jet_stream + isolinhas BRANCAS de PSI200 (função de corrente 200 hPa)
#   olr_anom                      – anomalia de OLR em shaded
#   olr_cores_psi200_contornos    – OLR em shaded + PSI200 em contorno (pêntada móvel 5d)
#   olr_cores_z250_contornos      – OLR em shaded + Z250 anom em contorno (pêntada móvel 5d)
#   wnd200_zonal_cores_psi200_contornos – vento zonal 200 hPa em shaded + PSI200 em contorno preto (só pêntada móvel 5d; paleta/levels do wnd250_zonal_anom)
#   wnd200_meridional_cores_psi200_contornos – vento MERIDIONAL 200 hPa em shaded + PSI200 em contorno preto (só pêntada móvel 5d; MESMA paleta/levels do vento zonal)
#   tsm_anom                      – anomalia de TSM em shaded (só reanálise)
#   tsm_abs                       – TSM absoluta 0..32°C (só reanálise; box Niño 3.4 diário)
#   wnd250_zonal_anom             – anomalia de vento zonal em 250 hPa
#   wnd850_zonal_anom             – anomalia de vento zonal em 850 hPa
#   wnd850_meridional_anom        – anomalia de vento meridional em 850 hPa
#   z250_abs                      – altura geopotencial 250 hPa ABSOLUTA (não anomalia). No s42,
#                                   o MP4 anda em HORA SINÓTICA (00/06/12/18Z) em vez de 1
#                                   passo/dia — reanálise E previsão; GIF/PNG seguem média do
#                                   período. Cores/faixa/opacidade em GLOBO_3D_VMIN/VMAX/NIVEIS/
#                                   PALETA/ALPHA_Z250_ABS (seção 5g).
#
#   z250_anom gera DOIS MP4s automaticamente (anomalia diária + média móvel de 5 dias); não
#   precisa listar z250_anom_5d aqui. Todos funcionam em reanálise E forecast, exceto tsm_anom/tsm_abs.
# Lista vazia [] = todas as registradas em app/src/uteis/globo_3d_anim.py.
VARIAVEIS_GLOBO_3D = ["z250_anom", "tmp850_anom"]
# Lista PRÓPRIA do s42 (plota campos ABSOLUTOS — fisicamente diferente do s38-s41, que plotam
# anomalia). Vazia [] = modo "SEM VARIÁVEL": plota o globo só com as features habilitadas
# (jato, ícones de pressão, caixas de texto, crédito), sem nenhum campo shaded. Não herda mais
# a VARIAVEIS_GLOBO_3D compartilhada — essa lista é exclusiva do s42.
GLOBO_3D_VARIAVEIS_S42 = []
# Lista PRÓPRIA do s43 (mapa 2D plano, irmão do s42 — mesmas variáveis absolutas fazem sentido
# aqui). Vazia [] = modo "SEM VARIÁVEL", mesmo comportamento do s42 acima. Não herda mais a
# VARIAVEIS_GLOBO_3D compartilhada — essa lista é exclusiva do s43.
GLOBO_3D_VARIAVEIS_S43 = []
# A lista de variáveis do s46 (globo inclinado de ALERTA) vive no _CONFIG_HEADER do próprio script
# (VARIAVEIS_GLOBO_3D em scripts/s46_globo_inclinado_3D_alerta.py) — a antiga GLOBO_3D_VARIAVEIS_S46
# foi aposentada junto com o fallback para as listas do s44.
# Sombreado do s46 = gouraud (igual ao s44). Como o pcolormesh é POR SCRIPT, o s46 tem o seu próprio
# (não herda o _S44). Ajuste/desligue por variável com GLOBO_3D_PCOLORMESH_<VAR> se precisar.
GLOBO_3D_PCOLORMESH_S46 = true
# Aparência do modo "SEM VARIÁVEL" (ficha sintética 'sem_variavel', sem campo shaded): cor
# sólida do oceano (o continente mostra o blue marble por baixo) e contorno costa/fronteiras/
# estados. Ajustáveis independente da variável ativa no s38-s43.
GLOBO_3D_COR_OCEANO_SEM_VARIAVEL      = "#0e426d"
GLOBO_3D_COR_CONTINENTE_SEM_VARIAVEL  = "#d9d9d9"   # cor sólida do continente quando NÃO há shaded (ficha sem_variavel) e SEM blue marble (cinza claro). Com satélite ligado é ignorada.
GLOBO_3D_COR_FRONTEIRAS_SEM_VARIAVEL  = "black"
GLOBO_3D_LW_COAST_SEM_VARIAVEL        = 1.0
GLOBO_3D_LW_BORDER_SEM_VARIAVEL       = 0.8
GLOBO_3D_LW_STATES_SEM_VARIAVEL       = 0.6
# Recortam o campo shaded do s42/s43 (qualquer variável), independente de câmera/voo (s42) ou
# área (s43) — os dados meteorológicos só aparecem dentro do recorte escolhido. Prioridade
# quando os dois estão ligados: BRASIL > CONTINENTE. Reaproveitam o recorte vetorial (Natural
# Earth 50m) já usado pelo `mascara_oceano` — litoral liso, sem serrilhado da grade do modelo.
PLOTAR_SOMENTE_BRASIL     = false   # só o território brasileiro (Natural Earth admin_0, BRA)
PLOTAR_SOMENTE_CONTINENTE = false   # só os continentes (mesmo recorte do `mascara_oceano`)
# Variantes automáticas (ex.: z250_anom -> tb z250_anom_5d, média móvel). false = gera SÓ a versão
# diária pedida (3 saídas por variável), sem a média móvel. Variantes na lista acima seguem valendo.
GLOBO_3D_VARIANTES_AUTO = true

# ── 5b. Voo da câmera ────────────────────────────────────────────────────
# Rotaciona de (LON/LAT_INICIAL) até (LON/LAT_FINAL). Lon negativa = Oeste.
GLOBO_3D_LON_INICIAL    = -150.0   # longitude de partida (meio do Pacífico)
GLOBO_3D_LAT_INICIAL    =    0.0   # latitude de partida
GLOBO_3D_LON_FINAL      =  -45.0   # longitude de chegada (costa do Brasil)
GLOBO_3D_LAT_FINAL      =  -15.0   # latitude de chegada
# "" = inclina conforme LAT_INICIAL/LAT_FINAL (varia no voo).
# Número fixo: >0 = mais HN visível; <0 = mais HS visível.
GLOBO_3D_INCLINACAO     = ""
GLOBO_3D_VOLTAS_EXTRA   =  0.0     # rotações completas extras antes de assentar no destino
# Curva de aceleração do voo: "linear" | "ease_out" (suave ao chegar) | "ease_in" | "ease_in_out"
GLOBO_3D_EASING         = "linear"
# Velocidade do campo animado (independente do voo): 1.0 = normal; 2.0 = 2×; 0.5 = metade.
GLOBO_3D_VELOCIDADE_VAR =  1.0

# ── 5c. Render ───────────────────────────────────────────────────────────
# Mais FRAMES_POR_DIA = voo mais lento e suave (mesmo trajeto em mais quadros).
GLOBO_3D_FRAMES_POR_DIA = 4        # quadros interpolados por dia
GLOBO_3D_FPS            = 20       # quadros por segundo do MP4
GLOBO_3D_TAMANHO_PX     = 1080     # resolução quadrada em pixels (1080 = FullHD)
# SEMPRE regenerar o MP4 (ignora o cache): true = todo run refaz o vídeo com os settings ATUAIS
# (features de aparência — box, caixa livre, câmera, cores — não entram na chave de cache, então
# o cache traria vídeo velho). Downloads seguem em cache; só o render é refeito. false = usa cache.
GLOBO_3D_SEMPRE_REGERAR = true
GLOBO_3D_WORKERS        = 0        # CPUs para render paralelo (0 = todos disponíveis)
# Recicla cada worker a cada N frames (mata+recria o processo p/ devolver RAM ao SO). Evita o
# leak que estoura a RAM em clipes longos (35 dias) com 2 variaveis (shaded + contorno). 0 = nunca.
GLOBO_3D_MAXTASKS       = 20
# CACHE DE FUNDO (otimizacao): nos frames de FUNDO CONGELADO (todos do GIF; cauda do MP4, onde campo e
# camera nao mudam) renderiza o fundo pesado (sombreado+reprojecao+costa+isolinhas) UMA vez e compoe
# so a corrente de jato por frame. ~2x mais rapido, SEM tocar em qualidade nem na animacao do jato
# (o jato e sempre desenhado por frame). true = ligado; false = render completo por frame (legado).
GLOBO_3D_BG_CACHE       = true
GLOBO_3D_BG_CACHE_CHECK = false    # autoteste: renderiza 1 frame congelado do jeito antigo e pelo cache e loga max|diff| (0=identico)
# Resolução da grade plotada: 0.25 = máximo detalhe (lento); 0.5 = rápido; 1.0 = mais suave.
GLOBO_3D_GRID_DEG       = 0.5
GLOBO_3D_COARSEN        = 1        # subamostragem extra da grade já montada (1 = sem reduzir)
GLOBO_3D_PROJECTION     = "nearside"   # s38/s39: "nearside" = globo flutuante | "orthographic"
# s41 (padrao Google Earth): projecao propria, sem afetar s38/s39. "google_earth" = camera mais
# perto (regiao ampliada, mais curvatura). GLOBO_3D_GE_ALTURA = altura da camera em metros
# (MENOR = mais zoom; geoestacionario ~35.786.000). Ajuste fino do enquadramento vira depois.
GLOBO_3D_PROJECTION_S41 = "google_earth"
GLOBO_3D_GE_ALTURA      = 5000000      # ZOOM: altura da camera em m (MENOR = mais perto = continente maior)
# Quadro PAISAGEM do s41 (mais largo que alto), reproduzindo o print de referencia: o globo e GRANDE
# (preenche a largura), com o centro do disco EMPURRADO PARA BAIXO -> ve-se a metade de cima do disco
# (America do Sul ampliada + arco do limbo no topo/cantos). A caixa do nome (topo-esq) e o subtitulo
# (topo-dir) caem no preto dos cantos superiores; a barra de legenda fica sobre o globo (caixa translucida).
GLOBO_3D_GE_ASPECT      = 0.62         # altura/largura do quadro (<1 = paisagem; menor = mais largo/baixo)
GLOBO_3D_GE_GLOBO_FRAC  = 1.02         # diametro do disco como fracao da LARGURA do quadro (>=1 preenche)
GLOBO_3D_GE_GLOBO_CY    = 0.29         # posicao vertical do CENTRO do disco (0=base,1=topo; MENOR = desce mais)
# ── s41: knobs proprios (GLOBO_3D_GE_*) — regulam SO o s41; sem eles, herda o valor do s39 ──
# Corte HS/HN (inclinacao fixa do globo): >0 mostra mais Hemisferio NORTE; <0 mais SUL; 0 = equador;
# "" = varia conforme LAT_INICIAL/FINAL do voo.
# GLOBO_3D_GE_INCLINACAO   = ""
# Camera FIXA na America do Sul (default: reproduz o enquadramento do print de referencia).
# Inicial == final => sem voo, so a variavel evolui no tempo. Para reativar o voo, mude os finais.
GLOBO_3D_GE_LON_INICIAL  = -58.0
GLOBO_3D_GE_LAT_INICIAL  = -17.0
GLOBO_3D_GE_LON_FINAL    = -58.0
GLOBO_3D_GE_LAT_FINAL    = -17.0
GLOBO_3D_GE_VOLTAS_EXTRA = 0.0        # giros completos extras antes de assentar
# GLOBO_3D_GE_EASING       = "ease_in_out"
# Ritmo da animacao SO do s41:
# GLOBO_3D_GE_FRAMES_POR_DIA = 5        # + frames = voo mais lento/suave
# GLOBO_3D_GE_FPS            = 8         # + fps = reproducao mais rapida
# GLOBO_3D_GE_VELOCIDADE_VAR = 1.0      # velocidade da variavel animada
# ── s41: TRES SAIDAS (por variavel) ── o s41 gera, alem do MP4 do periodo:
#   • MP4  (s41_<var>.mp4)        : voo da camera + evolucao dia a dia (SEM jato)
#   • PNG  (s41_<var>_media.png)  : figura da MEDIA do periodo + jato PARADO (estatico)
#   • GIF  (s41_<var>_media.gif)  : MEDIA do periodo (campo fixo) + 'JET STREAM'/setas animando W->E
GLOBO_3D_GE_GIF_FRAMES  = 48       # base do FLUXO do jato: frames p/ avancar 1 espacamento a velocidade 1 (loop do GIF = base x m; MAIOR = jato mais LENTO e suave no GIF **e no MP4**)
GLOBO_3D_GE_GIF_FPS     = 12       # fps do GIF (velocidade de reproducao das setas)

# ── s44: Globo 3D INCLINADO ("deitado") — knobs PROPRIOS (GLOBO_3D_INC_*), regulam SO o s44 ──
# Copia do s39 (mesmo pipeline reanalise/forecast, mesmas fichas, jato/icones/escoamento/caixas),
# mudando SO o enquadramento: em vez do disco flutuante visto de cima, a camera fica "deitada" —
# horizonte curvo so no topo do quadro (efeito Google Earth com pitch). Tecnica: janela de recorte
# DESCENTRALIZADA na NearsidePerspective. Nenhum GLOBO_3D_INC_* afeta s38-s43. Qualquer
# GLOBO_3D_INC_<X> tambem sobrepoe o GLOBO_3D_<X> compartilhado SO no s44 (ex.: _LON_INICIAL, _EASING).
GLOBO_3D_INC_ALTURA      = 9000000     # altura da camera em m (curvatura; MENOR = mais perto/mais curvo)
GLOBO_3D_INC_DEITAR      = 0.555       # o quanto "deita": desloca a janela p/ cima (fracao do raio; 0 = visto de cima). NAO confundir com INCLINACAO
GLOBO_3D_INC_JANELA_FRAC = 0.858       # zoom da janela (largura / diametro do disco; <1 = mais perto)
GLOBO_3D_INC_ASPECT      = 0.5625      # altura/largura do quadro (paisagem; 0.5625 = 16:9)
# Logo no canto inferior direito (so s44; usa a flag LOGO_CAPUCIN/GREC/AMPERE). Knobs proprios p/
# nao mexer no LOGO_WIDTH_FRAC global (usado nos outros mapas). Tamanho = fracao de min(largura,altura).
GLOBO_3D_INC_LOGO_WIDTH_FRAC   = 0.20  # tamanho do logo (0.16 era o global; maior = logo maior)
GLOBO_3D_INC_LOGO_MARGEM_X_FRAC = 0.02 # folga ate a borda DIREITA (fracao de min(larg,alt))
GLOBO_3D_INC_LOGO_MARGEM_Y_FRAC = 0.06 # folga ate a borda INFERIOR (fracao da altura; sobe acima do credito)
# Corte HS/HN (latitude fixa da camera, "gira" o globo no proprio eixo N-S): >0 = mostra mais o
# Hemisferio NORTE; <0 = mais o SUL (Brasil); "" (default) = camera segue o voo (LAT_INICIAL/FINAL).
# GLOBO_3D_INC_INCLINACAO  = ""

# ── ENQUADRAMENTOS SALVOS do globo inclinado (presets de camera nomeados) ──────────────────────
# O script escolhe UM pelo nome (ENQUADRAMENTO = "sul_brasil" no topo do s46) e o preset expande
# nos GLOBO_3D_INC_* acima. Existe porque os 5 knobs sao ACOPLADOS: trocar a altura sem trocar a
# inclinacao (nadir) joga o alvo p/ fora do quadro. Guardados aqui na mae por serem identidade fixa
# (como paleta por variavel), nao config de rodada -- o script so escolhe.
#
# Campos:
#   nome        : chave usada em ENQUADRAMENTO
#   altura      : ZOOM (m). Quanto de chao cabe. Vai EM PAR com `inclinacao`
#   inclinacao  : LATITUDE DO NADIR. A janela olha p/ o NORTE dele -> o nadir fica ao SUL do alvo.
#                 Mais NEGATIVO = alvo mais rasante e mais ALTO na tela; menos negativo = desce o
#                 alvo, mas empurra o horizonte p/ fora do topo
#   lon         : longitude do nadir = pan horizontal (mais a OESTE = mapa p/ a DIREITA; 1° ~ 5% da tela)
#   deitar      : sobe a janela de recorte (fracao do raio). ~0.85 poe o horizonte no topo c/ ~6% de
#                 ceu. Subir = mapa DESCE e ganha ceu, sem perder rasancia
#   janela_frac : PROPORCAO globo/continente = curvatura aparente do horizonte. Formula exata:
#                 flecha/altura_do_quadro = [1-sqrt(1-jf^2)] * aspecto / (2*jf)
#                 jf=0.70 -> 36% (vira "planetinha" c/ continente gigante) | jf=0.30 -> 14% (~=
#                 Google Earth, que mede ~12%) | jf=0.20 -> 9%
#
# NITIDEZ DO SATELITE: quem manda e GLOBO_3D_BLUE_MARBLE_MAX_PX (teto da FONTE). O default 4096
# (9,8 km/px) quebra em blocos abaixo de altura ~2000000; o s46 usa 8192 (4,9 km/px, nitidez nativa do
# Entrada/blue_marble.png). Subir GLOBO_3D_INC_BLUE_MARBLE_REGRID NAO resolve (testado c/ 3072): ele e a
# malha de DESTINO, e o bloco vem da fonte. O 8192 so e viavel na RAM por causa do recorte no bbox
# visivel (GLOBO_3D_BLUE_MARBLE_CROP) -- sem ele o warp custa 2,8 GB por frame POR WORKER.
#
# Todos os presets abaixo foram CONFERIDOS em render (1 frame, ficha sem_variavel).
ENQUADRAMENTOS = [
    {nome = "sul_brasil",          altura = 2000000, inclinacao = -51.0, lon = -54.0, deitar = 0.852, janela_frac = 0.30},
    {nome = "sul_brasil_centrado", altura = 2000000, inclinacao = -52.2, lon = -52.0, deitar = 0.852, janela_frac = 0.30},
    {nome = "sul_brasil_amplo",    altura = 9000000, inclinacao = -68.5, lon = -52.0, deitar = 0.851, janela_frac = 0.30},
    {nome = "chile_central",       altura = 13000000, inclinacao = -74.5, lon = -66.0, deitar = 0.852, janela_frac = 0.50},
    {nome = "sul_front_rs_sc",     altura = 2000000, inclinacao = -40.0, lon = -52.0, deitar = 0.50,  janela_frac = 0.35},
]
# sul_brasil          : RS/Uruguai no centro-direita, Pampa entrando pela esquerda, span ~13° (PADRAO)
# sul_front_rs_sc     : mesmo zoom do sul_brasil, mas o disco MAIS DE PE (nadir mais ao norte, -40, e
#                       deitar menor, 0.50) -> RS (ate o extremo sul) + SC quase de FRENTE, SEM ceu no topo
# sul_brasil_centrado : mesmo zoom, Sul centrado no quadro (~6% de ceu)
# sul_brasil_amplo    : RS ate SP/MS, span ~22° -- o mais parecido com o print do Google Earth
# chile_central       : Chile de ponta a ponta (norte-sul), Cordilheira a direita, Pacifico a esquerda.
#                       `janela_frac` 0.30->0.50 (2026-07-18): a janela de recorte e uma fatia LINEAR
#                       do disco (`larg = janela_frac * 2 * raio`, ver _aplicar_janela_inclinada em
#                       globo_3d_anim.py) -- 0.30 dava span ~24° (regiao central), 0.50 escala pra
#                       ~38-39° (pais inteiro), sem mexer em altura/inclinacao (ja centrados). EM
#                       CALIBRACAO por render (1 frame) -- conferir se a janela nao estoura o disco.
# PADRAO_TWC: true = os globos INCLINADOS (s44, s46 e os proximos) usam o estilo The Weather Channel
# (so credito + caixa azul do titulo + caixa cinza da data, via TITULO_THE_WEATHER_CHANNEL / _DATA),
# removendo o overlay Guillaume normal (caixa do nome, data, subtitulo, barra de legenda).
# false (default) = overlay padrao estilo s39. (Renomeada de S44_PADRAO_TWC: nao e exclusiva do s44.)
PADRAO_TWC               = false
# Caixa "Modelo <MODELO>" COLADA sob a caixa azul do titulo e alinhada a esquerda com ela (so no estilo
# TWC: s42 ou PADRAO_TWC). O nome do modelo vem do `fonte_label` -- o MESMO que nomeia a pasta de saida
# --, entao acompanha sozinho o RUN_* habilitado (GFS/GEFS/ECMWF/...) e vira 'ERA5 + <MODELO>' quando o
# periodo emenda reanalise+previsao. false = ninguem muda (default historico).
TITULO_THE_WEATHER_CHANNEL_MODELO          = false
TITULO_THE_WEATHER_CHANNEL_MODELO_COR      = "#14223d"
TITULO_THE_WEATHER_CHANNEL_MODELO_PREFIXO  = "Modelo"   # "Model" p/ pauta em ingles; "" = so a sigla
TITULO_THE_WEATHER_CHANNEL_MODELO_FONTSIZE = 12.0       # vs 19 do titulo azul
# Legenda de FAIXAS ao lado da caixa do modelo: uma caixinha por banda dos levels, com borda branca e
# o rotulo dentro. Desenha SO as faixas que aparecem PINTADAS no quadro -- maximo do PERIODO dentro do
# enquadramento E da area pintada (respeita PLOTAR_SOMENTE_BRASIL/CONTINENTE), calculado 1x por clipe
# (fixo: nao muda de tamanho durante o video). 1a linha alinhada a direita com a caixa da data; o que
# sobra desce alinhado a esquerda com ela. Rotulos/cores vem dos proprios levels+paleta (nao ha texto
# fixo p/ desalinhar da escala). Cor do texto: preto ou branco, por contraste com a faixa.
TITULO_THE_WEATHER_CHANNEL_LEGENDA          = false
TITULO_THE_WEATHER_CHANNEL_LEGENDA_FONTSIZE = 8.0
TITULO_THE_WEATHER_CHANNEL_LEGENDA_BORDA_LW = 1.2   # espessura da linha branca de cada caixinha (pontos)
# Vao ENTRE caixinhas (fracao da largura do quadro; 0.001 ~ 1 px em 1080). A faixa branca visivel entre
# duas caixinhas = este vao + as duas meias-bordas vizinhas -> p/ afina-la, mexa aqui e/ou no _BORDA_LW.
TITULO_THE_WEATHER_CHANNEL_LEGENDA_GAP      = 0.001

# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║  s38/s39/s40/s41: CORRENTES DE JATO ── ref. Entrada/JETSTREAM.png + Entrada/seta.png           ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
# MASTER UNICO: estas flags valem para os QUATRO globos (s38, s39, s40, s41). Se o master estiver
# ligado, o jato e plotado sobre QUALQUER campo atmosferico e em TODAS as saidas (MP4, PNG e GIF).
# O Z250 (altura geopotencial 250 hPa) e baixado a parte (ERA5/GDAS e todos os modelos) para
# localizar a isolinha-guia; se um modelo nao tiver Z250, avisa no terminal e segue sem o jato.
# Faixa central OPACA sobre a isolinha + faixas finas TRANSLUCIDAS, e por cima o NOME do jato + setas
# "enviar" deslizando W->E. Dois jatos INDEPENDENTES: JET_STREAM (azul) e SUBTROPICAL_JET (verde),
# cada um com NIVEL/COR/TEXTO/VELOCIDADE proprios; resto do estilo e COMPARTILHADO. Espacamento
# texto<->setas AUTOMATICO (qualquer string nunca sobrepoe as setas).
GLOBO_3D_JATO            = false      # master liga/desliga a(s) corrente(s) de jato nos 4 globos (em TODA saida/campo)
GLOBO_3D_JATO_HEMISFERIO_SUL   = true  # desenha o jato no HEMISFERIO SUL (lat < 0)
GLOBO_3D_JATO_HEMISFERIO_NORTE = true  # desenha o jato no HEMISFERIO NORTE (lat > 0). Ao olhar o HS, deixe false p/ nao plotar o jato do HN
GLOBO_3D_JATO_MP4_CAUDA_SEG = 7.0     # MP4: apos a animacao da variavel, N seg com o campo CONGELADO (ultimo dia) e o jato ainda FLUINDO (0 = sem cauda)
GLOBO_3D_JATO_PNG = true    # false = a figura estatica (PNG da media) sai SEM jato, mesmo com GLOBO_3D_JATO ligado (GIF/MP4 nao mudam)
# s41/s42: true = o MP4 tambem usa o CAMPO MEDIO fixo + camera parada (mesmo campo/camera do
# GIF) em vez da evolucao dia a dia/sinotica -- vira "GIF em formato de video", so com jato/
# icones/caixa livre em movimento sobre o campo parado. false = comportamento de sempre (MP4
# anima a variavel). Combine com GLOBO_3D_FADE_CAUDA=false p/ jato/icones/caixa aparecerem
# direto (sem esmaecer), ja que nao ha "antes" da cauda quando o campo ja e fixo desde o frame 0.
GLOBO_3D_MP4_MEDIA_FIXA = false
# s38/s39: alem do MP4 (periodo animado), gera uma 2a saida PNG com a MEDIA do periodo animado
# (mesmo intervalo DATA_INICIAL..DATA_FINAL), num quadro so, com a camera na vista final do voo.
# Arquivo: <dir>/<script>_<var>_media.png. s41/s42 ja geram esse PNG (+ GIF) sempre, independente
# desta flag. true = liga no s38/s39; false = so o MP4.
GLOBO_3D_PNG_MEDIA = true
# 3a saida: GIF do resumo (media/total do periodo, campo fixo + jato/setas animando). So s41/s42/s44/s46
# (no s38/s39 o MP4 ja e a versao animada). true = default historico; o s46 desliga no proprio header.
GLOBO_3D_GIF_MEDIA = true
# Teste s42: jato + icones de pressao + caixa de texto livre ficam INVISIVEIS durante o voo
# principal (variavel ainda mudando) e aparecem ESMAECENDO (fade-in) so quando o campo congela
# (inicio da cauda), pelos GLOBO_3D_FADE_CAUDA_DUR_SEG segundos seguintes. So no MP4 (precisa de
# cauda > 0). false = comportamento de sempre (visiveis do frame 0).
GLOBO_3D_FADE_CAUDA         = false
GLOBO_3D_FADE_CAUDA_DUR_SEG = 1.5
# Fade-in / fade-out do MP4 (todos os globos s38-s43): escurece a tela nas pontas do video. IN =
# sai do preto no comeco (0->tudo); OUT = escurece ate o preto no fim, pro video nao terminar seco.
# 0 = desligado (default). HOLD = segundos segurando no preto no fim do fade-out (evita corte seco
# no frame preto). So MP4 -- GIF (loop) e PNG estatico ignoram.
GLOBO_3D_FADE_IN_SEG        = 0.0
GLOBO_3D_FADE_OUT_SEG       = 0.0
GLOBO_3D_FADE_OUT_HOLD_SEG  = 0.4
# CONGELA o ULTIMO frame por N segundos ANTES do fade-out comecar (0 = desligado). Sem isto o
# fade-out morde os ultimos frames RENDERIZADOS -- o quadro final (no s46, o acumulado TOTAL do
# periodo) ja apareceria escurecendo. Com N>0 ele e' exibido INTEIRO por N s e so entao some.
# O fade-out passa a cair DENTRO desse congelamento, entao os dois nao competem. So MP4.
GLOBO_3D_ULTIMO_FRAME_SEG   = 0.0

# ── Jato 1: JET STREAM (polar) ──
GLOBO_3D_JET_STREAM            = true         # desenha este jato
# MANDATORIO: este valor (mgp) decide se o motor baixa Z250 (>=7500) ou Z500 (<7500) como
# campo-guia deste jato (ver _jato_kind_from_nivel) -- independente da variavel shaded ativa.
# ~9200-11500 = Z250; ~4700-6200 = Z500. Isolinha que vira o eixo do jato nesse nivel.
GLOBO_3D_JET_STREAM_NIVEL      = 10200        # mgp (escala Z250 por default)
GLOBO_3D_JET_STREAM_COR        = "#1787ad"    # cor (azul)
GLOBO_3D_JET_STREAM_TEXTO      = "JET STREAM"  # texto animado no fluxo (qualquer string)
GLOBO_3D_JET_STREAM_VELOCIDADE = 1.0          # velocidade do fluxo (GIF: espacamentos/loop, inteiro=seamless; MP4: espac./s)
# CORTE opcional: faz o jato SUMIR esmaecendo a LESTE (jusante) do ponto {lat,lon}, ao longo de
# `fade_out` graus de arco (faixa + faixas finas + texto + setas juntos). SO no modo DRAPE
# (GLOBO_3D_JATO_DRAPE=true; usado pelo s44). Ausente/comentado = jato inteiro (sem corte).
# GLOBO_3D_JET_STREAM_CUT = {lat = -30.0, lon = -50.0, fade_out = 15.0}

# ── Jato 2: SUBTROPICAL JET ──
GLOBO_3D_SUBTROPICAL_JET            = false        # desenha este jato
# MANDATORIO: mesma logica do JET_STREAM_NIVEL acima -- decide Z250 ou Z500 para ESTE jato,
# independente do escolhido para o JET_STREAM (os dois podem usar niveis/HGT diferentes).
GLOBO_3D_SUBTROPICAL_JET_NIVEL      = 10600        # mgp (escala Z250 por default; subtropical = + alto)
GLOBO_3D_SUBTROPICAL_JET_COR        = "#2e8b57"    # cor (verde)
GLOBO_3D_SUBTROPICAL_JET_TEXTO      = "SUBTROPICAL JET"  # texto animado no fluxo
GLOBO_3D_SUBTROPICAL_JET_VELOCIDADE = 1.0          # velocidade do fluxo deste jato
# CORTE opcional (idem JET_STREAM_CUT acima): some esmaecendo a LESTE do ponto {lat,lon} em
# `fade_out` graus de arco. So no modo DRAPE. Ausente/comentado = jato inteiro.
# GLOBO_3D_SUBTROPICAL_JET_CUT = {lat = -30.0, lon = -50.0, fade_out = 15.0}

# ── Estilo COMPARTILHADO pelos dois jatos ──
GLOBO_3D_JATO_ALPHA         = 1.0        # opacidade da faixa central (1 = opaca)
GLOBO_3D_JATO_STRIPE_ALPHA   = 0.35      # opacidade das faixas finas (translucidas)
GLOBO_3D_JATO_STRIPE_N       = 3         # numero de faixas finas por lado (acima e abaixo)
GLOBO_3D_JATO_STRIPE_GAP0    = 1.0       # graus: deslocamento da 1a faixa fina
GLOBO_3D_JATO_STRIPE_GAP     = 0.7       # graus: espacamento entre faixas finas
GLOBO_3D_JATO_SETAS_ENTRE = 2           # nº de setas entre palavras consecutivas (ref. = 2)
GLOBO_3D_JATO_SETAS_PASSO = 6.0         # graus entre setas (define o espaco; esp. entre palavras = 2*meia-largura-do-texto + (SETAS_ENTRE+1)*este)
GLOBO_3D_JATO_ARROW_COR   = "white"     # cor das setas
GLOBO_3D_JATO_TEXTO_COR   = "white"     # cor do texto
GLOBO_3D_JATO_TEXTO_MAX_CURVA = 110.0   # graus: só pula a palavra em curva EXTREMA (doubleback); alto = texto aparece nas curvas
GLOBO_3D_JATO_MIN_PTS       = 12        # minimo de pontos p/ um segmento de isolinha ser desenhado
GLOBO_3D_JATO_LAT_MIN       = 15.0      # banda de |latitude| do jato: minimo
GLOBO_3D_JATO_LAT_MAX       = 60.0      # banda de |latitude| do jato: maximo
# Tamanhos no modo TELA (nao-drape), em PONTOS:
GLOBO_3D_JATO_LARGURA       = 16.0       # espessura da faixa central OPACA (pt)
GLOBO_3D_JATO_STRIPE_LARGURA = 3.0       # espessura das faixas finas (pt)
GLOBO_3D_JATO_ARROW_TAM   = 12.0        # tamanho das setas (pt)
GLOBO_3D_JATO_TEXTO_TAM   = 11.0        # tamanho da fonte do texto (pt)
# DRAPE: renderiza o jato num raster plano lon x lat e "cola" na esfera (perspectiva 3D correta,
# rente a superficie; comprime suave no limbo em vez de embaralhar). Tamanhos em GRAUS geograficos.
GLOBO_3D_JATO_DRAPE            = false   # true = jato colado na superficie (perspectiva 3D correta)
GLOBO_3D_JATO_DRAPE_PX         = 5000    # resolucao do raster plano do jato (maior = texto + nitido, + lento)
GLOBO_3D_JATO_DRAPE_REGRID     = 2048    # resolucao da reprojecao imshow p/ a esfera
GLOBO_3D_JATO_DRAPE_PAD        = 6.0     # graus de folga em latitude ao redor da banda do jato
GLOBO_3D_JATO_LARGURA_DEG      = 2.2     # (drape) espessura da faixa central em GRAUS de latitude
GLOBO_3D_JATO_STRIPE_LARGURA_DEG = 0.5   # (drape) espessura das faixas finas em graus
GLOBO_3D_JATO_TEXTO_TAM_DEG    = 1.7     # (drape) altura do texto em graus
GLOBO_3D_JATO_ARROW_TAM_DEG    = 2.4     # (drape) tamanho das setas em graus

# ── Escoamento de baixos níveis: setas animadas (Entrada/seta.png) ao longo de uma
# trajetória lat/lon desenhada à mão (origem -> pontos_meio -> destino) — anotação
# ilustrativa, NÃO derivada de dado real de vento. Drapeada na esfera (mesmo mecanismo
# do jato). Cada item de GLOBO_3D_ESCOAMENTO_BAIXOS_NIVEIS aceita:
#   origem = [lat, lon]              (obrigatório)
#   destino = [lat, lon]             (obrigatório)
#   pontos_meio = [[lat,lon], ...]    (opcional, default [])
#   cor = "white"                    (default "white")
#   velocidade = 1.0                 (fase do fluxo por frame, igual JET_STREAM_VELOCIDADE)
#   espacamento_deg = 6.0            (distância angular entre setas ao longo do arco)
#   tamanho_deg = 2.5                (comprimento do sprite em graus, ao longo do voo)
#   largura_relativa = 1.0           (afina/engorda a seta; 1.0 = proporcao original do seta.png)
#   alpha = 1.0
#   fade_deg = 3.0                   (esmaece a seta perto da origem/destino; 0 = corte seco)
GLOBO_3D_ESCOAMENTO_BAIXOS_NIVEIS = []   # lista vazia = sem escoamentos; adicione entradas no settings.local.toml
GLOBO_3D_ESCOAMENTO_DRAPE_PX      = 3000     # resolucao do raster plano (mesma ideia do jato)
GLOBO_3D_ESCOAMENTO_DRAPE_REGRID  = 2048     # resolucao da reprojecao imshow p/ a esfera
GLOBO_3D_ESCOAMENTO_DRAPE_PAD     = 4.0      # graus de folga ao redor da curva no raster
# Teto na MAIOR dimensao do raster do escoamento: trajetoria alta/estreita fazia o canvas (RECRIADO
# por frame em cada worker) inchar p/ dezenas de MB. Reduz as 2 dimensoes juntas (pixels quadrados,
# setas nao distorcem); so cai a resolucao do raster, reamostrada no drape. Protege a RAM.
GLOBO_3D_ESCOAMENTO_DRAPE_MAX_PX  = 3000

# Sombreado em bandas (default): o contourf e renderizado num raster plano e composto no globo via
# imshow (evita o bug do cartopy que "lavava" frames). Qualidade controlada por:
GLOBO_3D_SHADE_PX       = 3600     # resolucao do raster do contourf (maior = mais nitido, mais lento)
# Recorta o raster do shaded na area VISIVEL antes de rasterizar. So faz efeito em vista fechada
# (s44/s46); nos globos flutuantes o bbox sai largo e o caminho e o global de sempre. Existe porque o
# raster GLOBAL da 10 px/grau (3600/360) -> a janela do inclinado recebe ~260 px de fonte e o warp
# NEAREST-NEIGHBOR do cartopy os estica p/ 1920 px de quadro = serrilhado em blocos. Recortado, o
# CROP_PX cobre so os ~26° visiveis (~79 px/grau, ~1:1 com a tela) num raster MENOR que o global ->
# mais nitido E menos RAM no warp. Subir o SHADE_PX global NAO e alternativa (1:1 exigiria ~26600 px
# = raster de 1,4 GB). false = comportamento antigo. Ver `_subset_campo_bbox` em globo_3d_anim.py.
GLOBO_3D_SHADE_CROP     = true
GLOBO_3D_SHADE_CROP_PX  = 2048     # largura do raster QUANDO recorta (a altura sai da proporcao do bbox)
# Upsample CUBICO do campo recortado (1 = off; override por variavel: _<VAR>). Resolve o OUTRO
# serrilhado: o da CELULA DO MODELO (0.25° do ECMWF = ~21 px de tela no zoom do inclinado ->
# as facetas do marching-squares do contourf viram degraus). NAO confundir com o GLOBO_3D_SIGMA_<VAR>:
# o sigma e media ponderada e ACHATA o campo (na chuva real: -17% no pico com 1.0, -54% com 3.0),
# enquanto a spline cubica PASSA pelos pontos da grade -> os valores do modelo ficam intactos (o
# overshoot e contido por clip no [min,max] do campo). Em campo de ALERTA (chuva) use ESTE, nunca o
# sigma. So atua no campo recortado (ver GLOBO_3D_SHADE_CROP) e tem teto interno de 4M celulas.
GLOBO_3D_SHADE_UPSAMPLE = 1.0
GLOBO_3D_SHADE_REGRID   = 2048     # resolucao da reprojecao do imshow (cartopy default=750=mole)
# (GLOBO_3D_PCOLORMESH=true na secao 5d troca as bandas pelo gradiente continuo gouraud)
