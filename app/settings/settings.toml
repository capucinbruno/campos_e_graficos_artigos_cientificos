# ══════════════════════════════════════════════════════════════════════════════
# app/settings/settings.toml  —  DEFAULTS GLOBAIS (master)
# ══════════════════════════════════════════════════════════════════════════════
# Valores padrão para TODOS os ambientes. Sobrescreva em settings.local.toml
# (gitignored) ou nas seções [development] / [production] ao final do arquivo.
# ══════════════════════════════════════════════════════════════════════════════

[default]


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  1. SISTEMA  (diretórios, logging, SFTP)                                │
# └─────────────────────────────────────────────────────────────────────────┘
CURRENT_ENV = "@jinja {{this.current_env | lower}}"   # "development" ou "production"
HOME_DIR    = "@jinja {{env.HOME}}"                   # home do usuário (via Jinja)

DIR_DADOS    = "dados"             # dados baixados do CDS (.nc/.grb)
DIR_FILE_NC  = "Entrada/arquivos_nc"
DIR_INPUT    = "Entrada"           # arquivos fixos (logos, legendas, climatologias)
DIR_OUTPUT   = "Saida"             # mapas e vídeos gerados
DIR_LOGS     = "logs"              # logs da aplicação

LEVEL_LOGGING    = "INFO"          # nível de log: "DEBUG" | "INFO" | "WARNING"
LOGGER_BACKTRACE = false           # mostra traceback completo nos logs
LOGGER_DIAGNOSE  = false           # diagnóstico detalhado do Loguru

SFTP_ENABLED = false               # habilita SFTP para buscar arquivos de suporte
RUN_FOR_SFTP = false               # alias legado — use SFTP_ENABLED


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  2. DATAS  (sobrescreva em settings.local.toml)                         │
# └─────────────────────────────────────────────────────────────────────────┘
# Usadas apenas em MODE="reanalysis". O CLI (--data-inicial / --data-final)
# tem precedência sobre estas chaves.
# O ERA5 tem ~5 dias de atraso — DATA_FINAL muito recente gera erro no CDS.
DATA_INICIAL = ""   # formato YYYY-MM-DD; vazio = obrigatório via CLI ou settings.local
DATA_FINAL   = ""   # formato YYYY-MM-DD; vazio = obrigatório via CLI ou settings.local


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  3. QUAIS SCRIPTS RODAR  (--all)                                        │
# └─────────────────────────────────────────────────────────────────────────┘
# true = habilitado (padrão). Para desabilitar, ponha false no settings.local.toml.
RUN_S00 = true   # Anomalia Geopotencial 850 hPa (ERA5/GDAS + PSL)
RUN_S01 = true   # Anomalia Geopotencial 500 hPa (ERA5/GDAS + PSL)
RUN_S02 = true   # Anomalia Geopotencial 250 hPa (ERA5/GDAS + PSL)
RUN_S03 = true   # Anomalia CHI200 (Velocity Potential)
RUN_S04 = true   # Anomalia PSI200 (Streamfunction)
RUN_S05 = true   # Anomalia OLR (PSL/NOAA)
RUN_S06 = true   # Anomalia OLR + Vento 250 e 850 hPa (streamlines)
RUN_S07 = true   # Rossby Wave Activity Flux + Anomalia Geopotencial 250 hPa
RUN_S08 = true   # Rossby Wave Activity Flux + Anomalia OLR
RUN_S09 = true   # Rossby Wave Activity Flux + Anomalia TSM
RUN_S10 = true   # Rossby Wave Activity Flux + Anomalia Temperatura 850 hPa
RUN_S11 = true   # Anomalia TSM — todas as áreas (OISSTv2/NOAA)
RUN_S12 = true   # Anomalia TSM + Vento 850 hPa — todas as áreas
RUN_S13 = true   # Média de TSM (OISSTv2) + Vento médio 1000 hPa
RUN_S14 = true   # Anomalia TSM + Vento 850 hPa (streamlines) + Anomalia OLR
RUN_S15 = true   # CHI200 (shaded + vento div.) + PSI200 (contour)
RUN_S16 = true   # Anomalia Vento Zonal 250 hPa + Vento Divergente 200 hPa
RUN_S17 = true   # Anomalia Vento Meridional 250 hPa
RUN_S18 = true   # Anomalia Temperatura 850 hPa + Vento 850 hPa
RUN_S19 = true   # Anomalia Temperatura 850 hPa + Vento 850 hPa + Geopotencial 500 hPa
RUN_S20 = true   # Anomalia OLR + Vento 850 hPa + Geopotencial 500 hPa
RUN_S21 = true   # Anomalia CHI200 + Streamlines 850 hPa + Vento divergente 200 hPa
RUN_S22 = true   # Anomalia OLR + Streamlines 850 hPa + Vento divergente 200 hPa
RUN_S23 = true   # Média de TSM (OISSTv2) + Correntes Marinhas de Superfície (CMEMS)
RUN_S24 = true   # Anomalia TSM Global + Índices (ENSO, IOD, AMO, TNA, TSA, SAD, PDO)
RUN_S25 = true   # OLR + Geop250 + WAF + Vento Divergente chi200<0
RUN_S26 = true   # chi200 + Geop250 + WAF + Vento Divergente chi200<0
RUN_S27 = true   # Hovmoller TSM + U850 (ENSO belt 5S–5N, 160E–80W)
RUN_S28 = true   # Hovmoller TSM + U850 (IOD belt 5S–5N, 50E–103E)
RUN_S29 = true   # Célula de Walker: anomalia omega 30S–30N (ERA5 vs PSL clim)
RUN_S30 = true   # Média de TSM por área, sem vento e sem OLR
RUN_S31 = true   # CHI200 intrasazonal (MJO) — pentadas + Hovmoller (método CPC)
RUN_S32 = true   # OLR intrasazonal (MJO) — pentadas + Hovmoller (método CPC)
RUN_S33 = true   # Hovmoller TSM + U850 (caixa livre lat/lon via settings)
RUN_S34 = true   # Guia de onda de Rossby — Ks 200 hPa + Z200 + WAF (Hoskins/Ambrizzi)
RUN_S35 = true   # Índice AAO (Antarctic Oscillation) — observado + previsões multi-modelo
RUN_S36 = true   # Índice MJO (diagrama de fase RMM1×RMM2) — observado + previsões
RUN_S37 = true   # Frequência de frentes frias por localidade (heatmap)
RUN_S38 = true   # Globo 3D animado estilo Ben Noll (MP4)
RUN_S39 = true   # Globo 3D animado estilo Guillaume Jauseau (MP4)


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  4. MODO DE DADOS E MODELOS DE PREVISÃO                                 │
# └─────────────────────────────────────────────────────────────────────────┘
# "reanalysis" usa DATA_INICIAL/DATA_FINAL (ERA5/GDAS).
# "forecast"   baixa o(s) modelo(s) habilitado(s) abaixo a partir de FORECAST_INIT.
MODE = "reanalysis"

# Modelos disponíveis — habilite um ou mais quando MODE="forecast":
RUN_GFS       = true    # GFS deterministico 0.25° (NOMADS) — ~16 d
RUN_GEFS      = false   # GEFS média do ensemble 0.5° (NOMADS) — até 35 d
RUN_ECMWF     = false   # ECMWF HRES 0.25° (Open Data) — ~10 d
RUN_ECMWF_ENS = false   # ECMWF ENS 50 membros (PESADO) — ~15 d
RUN_AIFS      = false   # IA determinística ECMWF 15 d (SEM OLR)
RUN_AIFS_ENS  = false   # IA ensemble ECMWF 50 membros (SEM OLR, PESADO)
RUN_AIGFS     = false   # IA determinística NCEP 16 d (SEM OLR)
RUN_AIGEFS    = false   # IA ensemble NCEP média pronta 16 d (SEM OLR, LEVE)
RUN_CFS       = false   # CFS pseudo-ensemble subsazonal ~45 d (SEM T850/Z250)

# Controle da rodada de previsão:
FORECAST_INIT = ""              # "" / "latest" = hoje; "YYYY-MM-DD" = rodada antiga
RODADA        = "00"            # hora do ciclo: "00", "06", "12" ou "18" (UTC)

# Horizonte e paralelismo:
GEFS_FORECAST_LEAD_DAYS = 35    # GEFS: 15 = rodada hoje 00Z; 35 = D-1 00Z (ciclo estendido)
DOWNLOAD_WORKERS        = 6     # dias de previsão baixados em paralelo (cuidado com NOMADS)
ECMWF_ENS_MEMBERS       = 50    # membros do ENS a mediar (reduza para acelerar; 20 ~ ok)
ECMWF_ENS_WORKERS       = 32    # downloads de membros em paralelo (ECMWF S3 escala bem)

# CFS (subsazonal):
CFS_LEAD_DAYS = 45              # horizonte do CFS (janela NCICS = 16 membros × 4 ciclos)
CFS_WORKERS   = 8               # downloads de membros do CFS em paralelo (não exagerar)

# s31 forecast (CHI200 intrasazonal): GEFS (35d) e CFS (45d) rodam automaticamente.
FORECAST_MAP_WINDOWS = [1, 2, 3, 5, 7, 10]   # janelas (dias) dos mapas espaciais do s31 forecast
NUM_RODADA           = 1                       # rodadas diárias consecutivas (lagged ensemble)

# s34 forecast: pentadas fixas geradas a partir do dia seguinte à rodada.
# Deixe ausente para herdar N_PENTADAS. Descomente APENAS se quiser valor diferente do s31.
# N_PENTADAS_FIXAS = 3

# Janela móvel (dias) dos mapas espaciais do s34 (Ks/RWS/WAF/Z200). 0 = período inteiro.
MOV_AVG_DAYS = 5


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  5. GLOBO 3D ANIMADO  (s38 Ben Noll / s39 Guillaume Jauseau)           │
# └─────────────────────────────────────────────────────────────────────────┘
# Gera 1 MP4 por variável. Modo é automático pelas datas: passado = reanalise,
# futuro = previsão, janela que cruza hoje = emenda observado + previsão.

# ── 5a. Variáveis ────────────────────────────────────────────────────────
# Campos disponíveis — comente/descomente para incluir ou excluir do plot:
#   "z250_anom"   — Anomalia de Geopotencial 250 hPa
#   "psi200_anom" — Anomalia da Função de Corrente 200 hPa (paleta z250 INVERTIDA: frio=psi+ HS)
#   "chi200_anom" — Anomalia do Potencial de Velocidade 200 hPa (paleta verde→marrom; verde=chi−)
#   "chi200_cores_psi200_contornos" — CHI200 shaded (verde→marrom) + PSI200 em isolinhas pretas
#   "chi200_cores_z250_contornos"   — CHI200 shaded (verde→marrom) + Z250 anom em isolinhas pretas
#                                     (CHI e Z250 ambos em pentada movel de 5 dias)
#   "tmp850_anom" — Anomalia de Temperatura 850 hPa
#   "tmp850_mslp" — Anomalia de Temperatura 850 hPa + PNMM isolinhas
#   "wind250_abs" — Vento absoluto 250 hPa (Jet Stream)
#   "olr_anom"    — Anomalia de OLR (CPC Blended; reanalise + GFS/GEFS/ECMWF forecast)
#   "olr_cores_psi200_contornos" — OLR shaded (BrBG_r) + PSI200 em isolinhas pretas
#                                  (OLR e PSI ambos em pentada movel de 5 dias, igual s34)
#   "olr_cores_z250_contornos"   — OLR shaded (BrBG_r) + Z250 anom em isolinhas pretas
#                                  (OLR e Z250 ambos em pentada movel de 5 dias)
#   "wnd250_zonal_anom"      — Anomalia de vento ZONAL 250 hPa (paleta do hgt250)
#   "wnd850_zonal_anom"      — Anomalia de vento ZONAL 850 hPa (paleta do hgt250)
#   "wnd850_meridional_anom" — Anomalia de vento MERIDIONAL 850 hPa (paleta do hgt250)
# Lista vazia [] = todas as registradas em app/src/uteis/globo_3d_anim.py.
VARIAVEIS_GLOBO_3D = ["z250_anom", "tmp850_anom"]

# ── 5b. Voo da câmera ────────────────────────────────────────────────────
# Rotaciona de (LON/LAT_INICIAL) até (LON/LAT_FINAL). Lon negativa = Oeste.
GLOBO_3D_LON_INICIAL    = -150.0   # longitude de partida (meio do Pacífico)
GLOBO_3D_LAT_INICIAL    =    0.0   # latitude de partida
GLOBO_3D_LON_FINAL      =  -45.0   # longitude de chegada (costa do Brasil)
GLOBO_3D_LAT_FINAL      =  -15.0   # latitude de chegada
# "" = inclina conforme LAT_INICIAL/LAT_FINAL (varia no voo).
# Número fixo: >0 = mais HN visível; <0 = mais HS visível.
GLOBO_3D_INCLINACAO     = ""
GLOBO_3D_VOLTAS_EXTRA   =  0.0     # rotações completas extras antes de assentar no destino
# Curva de aceleração do voo: "linear" | "ease_out" (suave ao chegar) | "ease_in" | "ease_in_out"
GLOBO_3D_EASING         = "linear"
# Velocidade do campo animado (independente do voo): 1.0 = normal; 2.0 = 2×; 0.5 = metade.
GLOBO_3D_VELOCIDADE_VAR =  1.0

# ── 5c. Render ───────────────────────────────────────────────────────────
# Mais FRAMES_POR_DIA = voo mais lento e suave (mesmo trajeto em mais quadros).
GLOBO_3D_FRAMES_POR_DIA = 4        # quadros interpolados por dia
GLOBO_3D_FPS            = 20       # quadros por segundo do MP4
GLOBO_3D_TAMANHO_PX     = 1080     # resolução quadrada em pixels (1080 = FullHD)
GLOBO_3D_WORKERS        = 0        # CPUs para render paralelo (0 = todos disponíveis)
# Recicla cada worker a cada N frames (mata+recria o processo p/ devolver RAM ao SO). Evita o
# leak que estoura a RAM em clipes longos (35 dias) com 2 variaveis (shaded + contorno). 0 = nunca.
GLOBO_3D_MAXTASKS       = 20
# Resolução da grade plotada: 0.25 = máximo detalhe (lento); 0.5 = rápido; 1.0 = mais suave.
GLOBO_3D_GRID_DEG       = 0.5
GLOBO_3D_COARSEN        = 1        # subamostragem extra da grade já montada (1 = sem reduzir)
GLOBO_3D_PROJECTION     = "nearside"   # "nearside" = globo flutuante | "orthographic"
# Sombreado em bandas (default): o contourf e renderizado num raster plano e composto no globo via
# imshow (evita o bug do cartopy que "lavava" frames). Qualidade controlada por:
GLOBO_3D_SHADE_PX       = 3600     # resolucao do raster do contourf (maior = mais nitido, mais lento)
GLOBO_3D_SHADE_REGRID   = 2048     # resolucao da reprojecao do imshow (cartopy default=750=mole)
# (GLOBO_3D_PCOLORMESH=true na secao 5d troca as bandas pelo gradiente continuo gouraud)

# ── 5d. Aparência ────────────────────────────────────────────────────────
# Rodapé esquerdo mostra a fonte automaticamente (ERA5 / nome do modelo).
GLOBO_3D_CREDITO       = "Bruno Capucin"   # autor no rodapé direito
GLOBO_3D_VINHETA             = true    # escurece cantos, mantém centro claro (estilo WaPo)
GLOBO_3D_ATMOSFERA           = true    # halo azul ao redor do globo (s39 Guillaume) — legado
GLOBO_3D_ATMOSFERA_ESTRELAS  = false   # halo azul + estrelas (s38 e s39); false = sem efeito
GLOBO_3D_CONTORNO            = false   # isolinhas brancas sobre o shaded (todas as variáveis)
GLOBO_3D_CONTORNO_Z250_ANOM  = true    # isolinhas ativas só no geopotencial 250 hPa
GLOBO_3D_CONTORNO_PSI200_ANOM = true   # isolinhas brancas finas contornando o shaded de PSI200
GLOBO_3D_CONTORNO_CHI200_ANOM = true   # isolinhas brancas finas contornando o shaded de CHI200
GLOBO_3D_ISOTERMA_0C         = true    # isoterma de 0°C absoluta em 850 hPa (s38 e s39)
# Caixa do Niño 3.4 (170°W–120°W, 5°S–5°N) + rótulo, em QUALQUER variável do globo.
# Ausente/comentado = usa o default da ficha (só tsm_anom traz a caixa). true = liga em todas;
# false = desliga em todas (inclusive tsm_anom). Override por variável: GLOBO_3D_BOX_NINO34_<VAR>.
# GLOBO_3D_BOX_NINO34          = false
GLOBO_3D_ISOL_HGT250_ABS     = false   # isolinhas de geopotencial absoluto 250 hPa (cinza escuro)
GLOBO_3D_ISOL_HGT250_INTERVALO = 60   # intervalo entre isolinhas absolutas de Z250 (mgp)
GLOBO_3D_VMIN_WIND250_ABS    = 30.0   # vento 250 hPa: abaixo deste valor = transparente (ms⁻¹)
GLOBO_3D_VMAX_WIND250_ABS    = 90.0   # vento 250 hPa: maximo da escala de cores (ms⁻¹)
GLOBO_3D_ISOL_HGT_WIND250    = false  # isolinhas de Z250 clim. sobrepostas ao jet stream
GLOBO_3D_VMAX_OLR_ANOM       = 60.0  # escala maxima da anomalia de OLR (W/m²)
GLOBO_3D_VMAX_PSI200_ANOM    = 50.0  # escala maxima (±) da anomalia de PSI200 (10⁶ m² s⁻¹)
GLOBO_3D_VMAX_CHI200_ANOM    = 100.0  # escala maxima (±) da anomalia de CHI200 (10⁵ m² s⁻¹); passo 10 c/ 20 bandas
# Isolinhas AUXILIARES (2a variavel sobre o shaded, ex.: psi200 preto sobre chi200 no campo
# chi200_cores_psi200_contornos). Intervalo/espessura/suavizacao (default vem da ficha):
# GLOBO_3D_CONTORNO_SERIE_INTERVALO = 5.0    # unidade da variavel de isolinha (psi: 10⁶ m²/s)
# GLOBO_3D_CONTORNO_SERIE_LW        = 0.5    # espessura das isolinhas
# GLOBO_3D_CONTORNO_SERIE_SIGMA     = 1.0    # suavizacao gaussiana (0 = desliga)
# Pentadas moveis: cada frame vira a media movel de N dias [d, d+N-1] deslizando 1 dia (igual s34).
# 0 = diario (sem media). A psi200_anom ja vem com 5 por padrao (ficha); por-variavel:
# GLOBO_3D_PENTADA_<VAR> (ex.: GLOBO_3D_PENTADA_PSI200_ANOM = 0 desliga; = 7 muda p/ 7 dias).
GLOBO_3D_PENTADA_DIAS        = 0      # global p/ as demais variaveis (0 = diario)
GLOBO_3D_SIGMA_OLR_ANOM      = 1.5   # suavizacao gaussiana do campo OLR (0 = desliga; grade 2.5°)
# Camada de OLR equatorial sobreposta a OUTRA variavel (ex.: vento zonal 250). Taper latitudinal
# SUAVE no alpha (sem corte reto): sinal cheio em |lat|<=CORE, some ate |lat|>=EDGE.
GLOBO_3D_OLR_OVERLAY         = false # liga a camada de OLR equatorial sobre a variavel principal
GLOBO_3D_OLR_LAT_CORE        = 5.0   # ate esta latitude o OLR aparece com forca total (graus)
GLOBO_3D_OLR_LAT_EDGE        = 12.0  # latitude onde o alpha do OLR chega a 0 (largura do taper)
GLOBO_3D_OLR_VMAX            = 40.0  # escala +-W/m² da anomalia de OLR no overlay
GLOBO_3D_OLR_ALPHA_MAX       = 0.9   # opacidade maxima do overlay (0..1)
GLOBO_3D_OLR_ALPHA_KNEE      = 8.0   # |OLR| (W/m²) onde o overlay fica opaco; abaixo, transparente
GLOBO_3D_MSLP_INTERVALO      = 4.0   # intervalo das isolinhas de PNMM (hPa)
GLOBO_3D_MSLP_COR            = "white"  # cor das isolinhas de PNMM
GLOBO_3D_MSLP_LW             = 0.5   # espessura das isolinhas de PNMM
GLOBO_3D_MSLP_SIGMA          = 2.0   # suavização gaussiana das isolinhas de PNMM (0 = desliga)
GLOBO_3D_PCOLORMESH          = false # true = pcolormesh(gouraud) no lugar de contourf (mais rápido, gradiente contínuo)
GLOBO_3D_SIGMA_HGT_CONTORNOS = 1.5  # suavização gaussiana das isolinhas Z250 (0 = desliga)
GLOBO_3D_COASTLINE_LW        = 0.5  # espessura das linhas de costa (original vetorial era 0.7)
GLOBO_3D_BORDERS_LW          = 0.35 # espessura das divisas de países (original era 0.5)
GLOBO_3D_STATES_LW           = 0.2  # espessura das divisas estaduais (original era 0.35)
# Fontes: coloque o .ttf em Entrada/fonts/ se não for fonte do sistema.
# Sem o arquivo, cai no fallback: título → serif, legenda → sans.
GLOBO_3D_FONTE_TITULO  = "Aptos Display"
GLOBO_3D_FONTE_LEGENDA = "Aptos Display"

# ── 5d-bis. Robustez: dias com anomalia degenerada (dado parcial no download) ──
# Um campo de anomalia global e balanceado (~30-60% de cada sinal). Um dia "todo de um
# sinal" indica dado GEFS parcial/incompleto no momento do download. A guarda detecta,
# avisa e (por padrao) PULA esses dias na animacao; se todos degenerarem, aborta com erro.
GLOBO_3D_DIA_DEGEN_FRAC       = 0.02   # limiar ABSOLUTO (fracao minima do sinal minoritario)
GLOBO_3D_DIA_DEGEN_REL        = 0.5    # RELATIVO: dia < 0.5x a mediana da serie = parcial (pega o caso parcial)
GLOBO_3D_SKIP_DIAS_DEGENERADOS = true  # true = pula dias ruins; false = so avisa

# ── 5e. Escala de cores — global ─────────────────────────────────────────
# Número de bandas do contourf. Menos = mais contraste (estilo WaPo); mais = degradê suave.
GLOBO_3D_NIVEIS = 16

# ── 5f. Escala de cores — overrides POR VARIÁVEL ─────────────────────────
# Se ausente, cada variável usa o default definido na sua ficha (globo_3d_anim.py).
# GLOBO_3D_NIVEIS_Z250_ANOM    = 50    # bandas do z250 (default na ficha: 50)
# GLOBO_3D_NIVEIS_TMP850_ANOM  = 128   # bandas do tmp850 (default na ficha: 128)
# Range ±mgp da escala do z250. Menor = mais cinza nos trópicos.
# Sugestão: 150 (muito cinza) | 200 (moderado) | 250 (pouco cinza)
GLOBO_3D_VMAX_Z250_ANOM = 200

# ── 5g. Paleta por variável ───────────────────────────────────────────────
# Sobrescreve a paleta da ficha. Lista de hex do extremo negativo ao positivo.
# GLOBO_3D_PALETA_Z250_ANOM   = ["#8A83A2", "#6656AC", ..., "#CF5A96"]
# GLOBO_3D_PALETA_TMP850_ANOM = ["#a30d92", "#720669", ..., "#3d3d3d"]


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  6. CONFIGURAÇÕES DOS SCRIPTS  (s31 → s37)                              │
# └─────────────────────────────────────────────────────────────────────────┘

# s31 — CHI200 intrasazonal / MJO (método CPC de remoção de média móvel)
JANELA_MEDIA_MOVEL = 120     # dias da média móvel removida (padrão CPC)
N_PENTADAS         = 6       # quantas pentadas (5 dias) de mapas gerar
HOVMOLLER_DIAS     = 120     # extensão temporal do Hovmoller
FAIXA_HOVMOLLER    = [-5, 5] # faixa de latitude média do Hovmoller
# Janela extra para o filtro Wheeler-Weickmann:
# 0 dias (padrão) = separação MJO/Kelvin imprecisa.
# 270 dias = separação limpa, 28 modos Kelvin (requer dados extras baixados).
WW_EXTRA_JANELA = 0

# s33 — Hovmoller de caixa livre (TSM + vento zonal 850 hPa)
# Padrões reproduzem o cinturão ENSO do s27 (5S–5N, 160E–80W).
# Cruza o antimeridiano se LON_MIN > LON_MAX.
HOV_FREE_LAT_MIN = -5.0
HOV_FREE_LAT_MAX =  5.0
HOV_FREE_LON_MIN = 160.0
HOV_FREE_LON_MAX = -80.0
HOV_FREE_NOME    = "Caixa Livre"
HOV_FREE_MAP_PAD = 10.0      # padding (graus) ao redor da caixa no mapa

# s34 — Guia de onda de Rossby (Ks 200 hPa — Hoskins & Ambrizzi 1993 + v'200)
# Dois Hovmollers de v'200: faixa subtropical (~30°S) e polar (~50°S).
WGUIDE_SMOOTH_DEG              = 5.0    # suavização (graus) do escoamento antes da 2ª derivada
WGUIDE_HOV_SUBTROPICAL_LAT_MIN = -45.0
WGUIDE_HOV_SUBTROPICAL_LAT_MAX = -20.0
WGUIDE_HOV_POLAR_LAT_MIN       = -60.0
WGUIDE_HOV_POLAR_LAT_MAX       = -40.0

# s35 — Índice AAO (Antarctic Oscillation)
AAO_HIST_DAYS = 30   # dias de observado (ERA5/GDAS) antes das previsões no gráfico
# Backfill one-off: preenche histórico de verificação via AWS S3.
# Deixe false no uso normal; ligue só para semear o arquivo (idempotente).
S35_BACKFILL          = false
