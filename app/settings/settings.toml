# ══════════════════════════════════════════════════════════════════════════════
# app/settings/settings.toml  —  DEFAULTS GLOBAIS (master)
# ══════════════════════════════════════════════════════════════════════════════
# Valores padrão para TODOS os ambientes. Sobrescreva em settings.local.toml
# (gitignored) ou nas seções [development] / [production] ao final do arquivo.
# ══════════════════════════════════════════════════════════════════════════════

[default]


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  1. SISTEMA  (diretórios, logging, SFTP)                                │
# └─────────────────────────────────────────────────────────────────────────┘
CURRENT_ENV = "@jinja {{this.current_env | lower}}"   # "development" ou "production"
HOME_DIR    = "@jinja {{env.HOME}}"                   # home do usuário (via Jinja)

DIR_DADOS    = "dados"             # dados baixados do CDS (.nc/.grb)
DIR_FILE_NC  = "Entrada/arquivos_nc"
DIR_INPUT    = "Entrada"           # arquivos fixos (legendas, climatologias)
DIR_OUTPUT   = "Saida"             # mapas e vídeos gerados
DIR_LOGS     = "logs"              # logs da aplicação

LEVEL_LOGGING    = "INFO"          # nível de log: "DEBUG" | "INFO" | "WARNING"
LOGGER_BACKTRACE = false           # mostra traceback completo nos logs
LOGGER_DIAGNOSE  = false           # diagnóstico detalhado do Loguru

SFTP_ENABLED = false               # habilita SFTP para buscar arquivos de suporte
RUN_FOR_SFTP = false               # alias legado — use SFTP_ENABLED


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  2. PESQUISADOR  (defina em settings.local.toml — nao versione seu nome)│
# └─────────────────────────────────────────────────────────────────────────┘
# Identifica quem esta rodando o projeto, para usar a KEY_CDS certa (uma por
# pesquisador, em app/settings/.secrets.toml — ver .secrets_example.toml).
# Valores aceitos: "capucin" | "reboita" | "gozzo" | "vemado"
PESQUISADOR = ""   # vazio = obrigatorio definir em settings.local.toml


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  3. DATAS  (sobrescreva em settings.local.toml)                         │
# └─────────────────────────────────────────────────────────────────────────┘
# O CLI (--data-inicial / --data-final) tem precedência sobre estas chaves.
# O ERA5 tem ~5 dias de atraso — DATA_FINAL muito recente gera erro no CDS.
DATA_INICIAL = ""   # formato YYYY-MM-DD; vazio = obrigatório via CLI ou settings.local
DATA_FINAL   = ""   # formato YYYY-MM-DD; vazio = obrigatório via CLI ou settings.local


# ══════════════════════════════════════════════════════════════════════════════
# CONFIGURAÇÕES POR AMBIENTE
# ══════════════════════════════════════════════════════════════════════════════

[development]
LEVEL_LOGGING    = "DEBUG"
LOGGER_BACKTRACE = true
LOGGER_DIAGNOSE  = true
SFTP_ENABLED     = true    # acessa arquivos remotos via SSH/SFTP
RUN_FOR_SFTP     = true

# Servidor remoto
HOSTNAME_REMOTE  = "152.67.34.247"
USER_SSH         = "ubuntu"
PORT_SSH         = 22
SSH_KEY_PATH     = "@jinja {{env.HOME}}/.ssh/meteorologia-oracle-sp.pem"
SERVER_ALIVE_INTERVAL = 120   # keep-alive SSH em segundos

# Diretórios remotos
REMOTE_DIR_DADOS   = "/home/ubuntu/meteorologia/campos-observados/dados"
REMOTE_DIR_INPUT   = "/home/ubuntu/meteorologia/campos-observados/Entrada"
REMOTE_DIR_OUTPUT  = "/home/ubuntu/meteorologia/campos-observados/Saida"

[qa]
LEVEL_LOGGING    = "DEBUG"
LOGGER_BACKTRACE = true
LOGGER_DIAGNOSE  = false
SFTP_ENABLED     = false

[production]
RUN_FOR_SFTP = false
SFTP_ENABLED = false

# Diretórios locais no servidor (caminhos absolutos)
DIR_DADOS  = "/home/ubuntu/meteorologia/campos-observados/dados"
DIR_INPUT  = "/home/ubuntu/meteorologia/Entrada"
DIR_OUTPUT = "/home/ubuntu/meteorologia/Saida"
