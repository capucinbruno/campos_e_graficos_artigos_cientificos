GLOBO_3D_PTYPE_CODIGOS_NEVE = [5, 6]
# 8 faixas, ciano -> roxo claro -> rosa claro, em CM DE NEVE (1 a 100 cm) -- `tp`/`APCP` vem em mm
# de LIQUIDO; a razão neve:líquido (SLR, "snow-to-liquid ratio") converte: cm_neve = mm_líquido *
# razão / 10. 10:1 é a regra clássica (neve fofa); neve mais densa/molhada tem razão menor (ex. 5:1).
GLOBO_3D_NEVE_RAZAO_LIQUIDO = 10.0
