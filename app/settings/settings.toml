# ── NEVE por TIPO (overlay opcional sobre a ficha `precip_abs`, ver setting `NEVE`) ─────────────
# Forecast-only, ECMWF ou GFS (únicos modelos com downloader de tipo de precipitação). NÃO é um
# campo à parte: a chuva continua vindo do pipeline normal do precip_abs (paleta/upsample/blue
# marble já calibrados ali) — aqui só a NEVE, classificada por passo NATIVO e desenhada por cima.
# ECMWF: código `ptype` (tabela OMM 4.201) — fora da lista `GLOBO_3D_PTYPE_CODIGOS_NEVE` não conta
# como neve. GFS: flag binária `CSNOW` (não tem código único; `GLOBO_3D_PTYPE_CODIGOS_NEVE` não se
