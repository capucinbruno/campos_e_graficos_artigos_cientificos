# Copie para .secrets.toml e preencha com suas credenciais
# NUNCA commite o .secrets.toml!

[default]
# Uma chave por pesquisador (projeto compartilhado — cada um usa a sua propria).
# Preencha so a(s) sua(s); o downloader escolhe pela chave PESQUISADOR do settings.local.toml.
KEY_CDS_CAPUCIN = "chave-copernicus-do-capucin-aqui"
KEY_CDS_REBOITA = "chave-copernicus-do-reboita-aqui"
KEY_CDS_GOZZO   = "chave-copernicus-do-gozzo-aqui"
KEY_CDS_VEMADO  = "chave-copernicus-do-vemado-aqui"

# Configuracoes SSH/SFTP para download de arquivos de suporte (climatologias)
# Necessario apenas em ambiente development (SFTP_ENABLED=true)
[development]
SSH_HOST = "152.67.34.247"
SSH_PORT = 22
SSH_USERNAME = "ubuntu"
SSH_KEY_PATH = "~/.ssh/meteorologia-oracle-sp.pem"

# Em production o SFTP nao e utilizado (acesso local ao servidor)
[production]
SSH_HOST = "152.67.34.247"
SSH_PORT = 22
SSH_USERNAME = "ubuntu"
SSH_KEY_PATH = "~/.ssh/meteorologia-oracle-sp.pem"
