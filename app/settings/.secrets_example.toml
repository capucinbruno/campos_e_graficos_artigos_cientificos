# Copie para .secrets.toml e preencha com suas credenciais
# NUNCA commite o .secrets.toml!

[default]
KEY_CDS = "sua-chave-copernicus-aqui"

# Copernicus Marine Service (CMEMS) — cadastro em marine.copernicus.eu
# Usado para download de correntes marinhas (GLOBAL_ANALYSISFORECAST_PHY_001_024)
CMEMS_USERNAME = "seu-usuario-cmems-aqui"
CMEMS_PASSWORD = "sua-senha-cmems-aqui"

# NASA Earthdata — cadastro em urs.earthdata.nasa.gov (gere o token em Applications > Generate
# Token). Usado pelo s49 para baixar IMERG-GPM (via earthaccess) fora do dominio do MERGE/CPTEC.
EARTHDATA_TOKEN = "seu-token-earthdata-aqui"

# Configuracoes SSH/SFTP para download de arquivos de suporte (climatologias)
# Necessario apenas em ambiente development (SFTP_ENABLED=true)
[development]
SSH_HOST = "152.67.34.247"
SSH_PORT = 22
SSH_USERNAME = "ubuntu"
SSH_KEY_PATH = "~/.ssh/meteorologia-oracle-sp.pem"

# Em production o SFTP nao e utilizado (acesso local ao servidor)
[production]
SSH_HOST = "152.67.34.247"
SSH_PORT = 22
SSH_USERNAME = "ubuntu"
SSH_KEY_PATH = "~/.ssh/meteorologia-oracle-sp.pem"
