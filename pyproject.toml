[project]
name = "campos-observados-era5"
version = "0.2.0"
description = "Download e plotagem de campos observados ERA5"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "pandas>=3.0.1,<4",
    "cartopy>=0.25.0,<0.27",
    "matplotlib>=3.10.8,<4",
    "numpy>=2.4.3,<3",
    "scipy>=1.17.1,<2",
    "xarray>=2026.2.0,<2027",
    "netcdf4>=1.7.4,<2",
    "loguru>=0.7.3,<0.8",
    "paramiko>=4.0.0,<5",
    "dynaconf>=3.2.12,<4",
    "fake-headers>=1.0.2,<2",
    "cdsapi>=0.7.7,<0.8",
    "jinja2>=3.1.0,<4",
    "cfgrib>=0.9.15.1,<0.10",
    "tqdm>=4.66.0,<5",
    "httpx>=0.27.0,<1",
    "requests>=2.31.0,<3",
    "tnflux>=0.9.2",
    "metpy>=1.7.1",
    "copernicusmarine>=2.0.0",
    "rich>=15.0.0",
    "playwright>=1.40.0,<2",
    "plotly>=6.0.0,<7",
    "kaleido>=1.0.0",
    "dask>=2026.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.10",
    "isort>=6.0.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "taskipy>=1.14.1",
    "pre-commit>=4.0.1",
]

# ============================================================================
# TASKIPY - Task runner
# ============================================================================
# Uso: uv run task <nome>
# ============================================================================
[tool.taskipy.tasks]
sort = "isort app/ scripts/"
lint = "ruff check app/ scripts/"
format = "ruff format app/ scripts/"
fix = "ruff check --fix app/ scripts/"
test = "pytest tests/ -v"
check = "task lint && task test"
run = "python run_script.py"
list = "python run_script.py --list"
clean = """
echo 'Limpando caches e arquivos temporarios...' && \
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true && \
find . -type f -name '*.pyc' -delete 2>/dev/null || true && \
find . -type d -name '.pytest_cache' -exec rm -rf {} + 2>/dev/null || true && \
find . -type d -name '.ruff_cache' -exec rm -rf {} + 2>/dev/null || true && \
find . -type d -name 'htmlcov' -exec rm -rf {} + 2>/dev/null || true && \
find . -type f -name '.coverage' -delete 2>/dev/null || true && \
find . -type f -name '.coverage.*' -delete 2>/dev/null || true && \
echo 'Limpeza concluida!'
"""

# ============================================================================
# RUFF - Linter e formatter
# ============================================================================
[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
preview = true
select = ['F', 'E', 'W', 'PL', 'PT']
ignore = [
    'PLR0914',  # Too many local variables
    'PLR2004',  # Magic value used in comparison
    'PLR6301',  # Method could be a function/static method
    'PLR1702',  # Too many nested blocks
    'PLR0915',  # Too many statements
    'F841',     # Local variable assigned but never used
    'F403',     # 'from module import *' used
    'PLC1901',  # Compare to empty string
    'PLW2901',  # For loop variable overwritten
    'F405',     # Name may be undefined from star imports
    'PLR0911',  # Too many return statements
    'PLR0912',  # Too many branches
    'E501',     # Line too long
    'PLR1714',  # Consider merging multiple comparisons
    'PLR0913',  # Too many arguments to function call
    'PLW1514',  # Using open without explicit encoding
    'PLC0415',  # Import should be at top of file
    'PLR0917',  # Too many positional arguments
    'PLR1722',  # Use sys.exit()
    'F821',     # Undefined name
    'PLR6104',  # Nested function definition
    'PLR0904',  # Too many public methods
    'PLC0206',  # Extracting value from dict without .items()
]

[tool.ruff.format]
preview = true
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# ISORT - Organizacao de imports
# ============================================================================
[tool.isort]
profile = "black"
line_length = 105
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
import_heading_stdlib = "Bibliotecas padrão"
import_heading_thirdparty = "Bibliotecas de terceiros"
import_heading_firstparty = "Módulos locais"
known_first_party = ["app"]
known_third_party = [
    "cartopy",
    "cdsapi",
    "cfgrib",
    "dynaconf",
    "fake_headers",
    "httpx",
    "jinja2",
    "loguru",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pandas",
    "paramiko",
    "requests",
    "scipy",
    "tqdm",
    "xarray",
]
skip = [".venv", "__pycache__", ".cache"]
skip_glob = ["*.ipynb"]

# ============================================================================
# PYTEST - Testes
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra --strict-markers --tb=short"

# ============================================================================
# BUILD
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "Scripts"]
