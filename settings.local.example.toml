# ══════════════════════════════════════════════════════════════════════════════
# settings.local.example.toml  —  TEMPLATE DE OVERRIDES PESSOAIS
# ══════════════════════════════════════════════════════════════════════════════
# Copie este arquivo para  settings.local.toml  (gitignored).
# Descomente e ajuste APENAS o que quiser mudar.
# Tudo que não estiver aqui herda o valor padrão de app/settings/settings.toml.
# ══════════════════════════════════════════════════════════════════════════════

# [default]


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  1. PERÍODO DE INTERESSE                                                │
# └─────────────────────────────────────────────────────────────────────────┘
# Datas inclusivas no formato YYYY-MM-DD.
# O ERA5 tem ~5 dias de atraso; DATA_FINAL muito recente causa erro no CDS.

# DATA_INICIAL = "2026-05-29"
# DATA_FINAL   = "2026-06-04"


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  2. QUAIS SCRIPTS RODAR  (--all)                                        │
# └─────────────────────────────────────────────────────────────────────────┘
# Por padrão todos estão habilitados. Descomente a linha para desabilitar.

# RUN_S00 = false   # vento 100 m + MSLP
# RUN_S01 = false   # anomalia geopotencial 250 hPa
# RUN_S04 = false   # anomalia TSM
# RUN_S09 = false   # vento 850 hPa + temperatura
# RUN_S10 = false   # anomalia temperatura 850 hPa
# RUN_S16 = false   # vento divergente / WAF Rossby
# RUN_S31 = false   # CHI200 intrasazonal / MJO
# RUN_S33 = false   # Hovmoller de caixa livre
# RUN_S34 = false   # guia de onda de Rossby (Ks)
# RUN_S35 = false   # índice AAO
# RUN_S36 = false   # índice MJO / RMM
# RUN_S37 = false   # heatmap de frentes frias
# RUN_S38 = false   # globo 3D animado (estilo Ben Noll)
# RUN_S39 = false   # globo 3D animado (estilo Guillaume Jauseau)
# RUN_S40 = false   # globo 3D ESTATICO (PNGs: diario/media movel/pentadas/media total)
# RUN_S41 = false   # globo 3D animado padrao Google Earth (MP4; copia do s39, projecao ampliada)


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  3. MODO DE DADOS                                                       │
# └─────────────────────────────────────────────────────────────────────────┘
# "reanalysis" usa DATA_INICIAL/DATA_FINAL (ERA5).
# "forecast"   baixa o modelo mais recente habilitado abaixo.

# MODE = "reanalysis"


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  4. MODELOS DE PREVISÃO  (só quando MODE = "forecast")                  │
# └─────────────────────────────────────────────────────────────────────────┘

# Quais modelos rodar — descomente o(s) que quiser:
# RUN_GFS       = false   # GFS deterministico 0.25° (NOMADS) — 16 d
# RUN_GEFS      = false   # GEFS ensemble médio 0.5° (NOMADS) — 35 d
# RUN_ECMWF     = false   # ECMWF HRES 0.25° (Open Data) — 10 d
# RUN_ECMWF_ENS = false   # ECMWF ENS 50 membros (PESADO) — 15 d
# RUN_AIFS      = false   # IA ECMWF deterministico 15 d  (SEM OLR)
# RUN_AIFS_ENS  = false   # IA ECMWF 50 membros (SEM OLR, PESADO)
# RUN_AIGFS     = false   # IA NCEP deterministico 16 d   (SEM OLR)
# RUN_AIGEFS    = false   # IA NCEP ensemble médio 16 d   (SEM OLR, LEVE)
# RUN_CFS       = false   # CFS subsazonal ~45 d          (SEM T850/Z250)

# Controle da rodada
# FORECAST_INIT           = ""    # "" / "latest" = hoje; "YYYY-MM-DD" = rodada antiga
# RODADA                  = "00"  # hora do ciclo: "00", "06", "12" ou "18" (UTC)
# DOWNLOAD_WORKERS        = 6     # dias de previsão baixados em paralelo
# GEFS_FORECAST_LEAD_DAYS = 35    # horizonte: 15 = rodada hoje 00Z; 35 = D-1 00Z
# ECMWF_ENS_MEMBERS       = 50    # membros a mediar (reduza para acelerar)
# ECMWF_ENS_WORKERS       = 32    # downloads em paralelo (S3 escala bem)


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  5. GLOBO 3D ANIMADO  (s38 Ben Noll / s39 Guillaume Jauseau)           │
# └─────────────────────────────────────────────────────────────────────────┘

# ── 5a. Quais variáveis animar ────────────────────────────────────────────
# [] = todas as registradas. Cada variável gera um MP4 separado.
#   z250_anom                     – anomalia de Z250 em shaded (gera tb a média móvel de 5 dias)
#   psi200_anom                   – anomalia de PSI200 em shaded
#   chi200_anom                   – anomalia de CHI200 em shaded
#   chi200_cores_psi200_contornos – CHI200 em shaded + PSI200 em contorno (pêntada móvel 5d)
#   chi200_cores_z250_contornos   – CHI200 em shaded + Z250 anom em contorno (pêntada móvel 5d)
#   tmp850_anom                   – anomalia de temperatura do ar em 850 hPa
#   tmp850_mslp                   – anomalia de temperatura em 850 hPa + PNMM em contorno
#   tmp850_cores_psi200_contornos – T850 em shaded + PSI200 em contorno (pêntada móvel 5d)
#   jet_stream                    – magnitude do vento em 250 hPa (corrente de jato)
#   jet_stream_psi200_contour     – jet_stream + isolinhas BRANCAS de PSI200 (função de corrente 200 hPa)
#   olr_anom                      – anomalia de OLR em shaded
#   olr_cores_psi200_contornos    – OLR em shaded + PSI200 em contorno (pêntada móvel 5d)
#   olr_cores_z250_contornos      – OLR em shaded + Z250 anom em contorno (pêntada móvel 5d)
#   tsm_anom                      – anomalia de TSM em shaded (só reanálise)
#   tsm_abs                       – TSM absoluta 0..32°C (só reanálise; box Niño 3.4 diário)
#   wnd250_zonal_anom             – anomalia de vento zonal em 250 hPa
#   wnd850_zonal_anom             – anomalia de vento zonal em 850 hPa
#   wnd850_meridional_anom        – anomalia de vento meridional em 850 hPa
#
#   z250_anom gera DOIS MP4s automaticamente (anomalia diária + média móvel de 5 dias); não
#   precisa listar z250_anom_5d aqui. Todos funcionam em reanálise E forecast, exceto tsm_anom/tsm_abs.
# GLOBO_3D_VARIANTES_AUTO = true   # false = z250_anom gera SÓ a versão diária (3 saídas), sem a média móvel de 5 dias
# VARIAVEIS_GLOBO_3D = ["z250_anom", "tmp850_anom", "wnd250_zonal_anom", "wnd850_meridional_anom"]
# GLOBO_3D_PNG_MEDIA = true   # s38/s39: além do MP4, gera 2ª saída PNG com a MÉDIA do período (DATA_INICIAL..DATA_FINAL). false = só o MP4
# Escalas (±ms⁻¹) dos campos de vento anômalo (paleta do hgt250):
# GLOBO_3D_VMAX_WND250_ZONAL_ANOM      = 20.0
# GLOBO_3D_VMAX_WND850_ZONAL_ANOM      = 10.0
# GLOBO_3D_VMAX_WND850_MERIDIONAL_ANOM = 8.0

# ── 5b. Voo da câmera ────────────────────────────────────────────────────
# O globo rotaciona de (LON/LAT_INICIAL) até (LON/LAT_FINAL).
# Longitude negativa = Oeste.
# GLOBO_3D_LON_INICIAL    = -150.0   # meio do Pacífico
# GLOBO_3D_LAT_INICIAL    =    0.0
# GLOBO_3D_LON_FINAL      =  -45.0   # costa do Brasil
# GLOBO_3D_LAT_FINAL      =  -15.0
# GLOBO_3D_INCLINACAO     = ""        # "" = usa LAT_INICIAL/FINAL; número = fixo (>0 = HN)
# GLOBO_3D_VOLTAS_EXTRA   =    0.0   # rotações extras antes de assentar no ponto final
# GLOBO_3D_EASING         = "linear" # "linear" | "ease_out" | "ease_in" | "ease_in_out"
# GLOBO_3D_VELOCIDADE_VAR =    1.0   # velocidade do campo animado (1=normal; 2=2×)

# ── 5c. Render ───────────────────────────────────────────────────────────
# GLOBO_3D_FRAMES_POR_DIA = 4        # quadros por dia — mais = voo mais suave, mais pesado
# GLOBO_3D_FPS            = 20       # quadros por segundo do MP4
# GLOBO_3D_TAMANHO_PX     = 1080     # resolução quadrada em pixels (1080 = FullHD)
# GLOBO_3D_WORKERS        = 0        # CPUs para render paralelo (0 = todos; reduza p/ 3-4 se a RAM estourar, ex.: campo com OLR overlay em PC <=8 GB)
# GLOBO_3D_BG_CACHE       = true     # cache de fundo (GIF + cauda do MP4): ~2x + rápido, sem perda de qualidade nem impacto no jato
# GLOBO_3D_BG_CACHE_CHECK = false    # autoteste: compara 1 frame full vs cache e loga max|diff| (0=idêntico). Ligue 1x p/ conferir
# GLOBO_3D_GRID_DEG       = 0.5      # resolução da grade (0.25 = máx detalhe; 0.5 = rápido)
# GLOBO_3D_COARSEN        = 1        # subamostragem extra da grade (1 = sem subamostragem)
# GLOBO_3D_PROJECTION     = "nearside" # "nearside" (globo flutuante) ou "orthographic"
# GLOBO_3D_OLR_OVERLAY    = false      # 2ª camada shaded (OLR equatorial) sobre a variável principal — PESADO; false se a RAM estourar

# ── 5d. Aparência ────────────────────────────────────────────────────────
# GLOBO_3D_CREDITO      = "Bruno Capucin"   # crédito no rodapé direito
# GLOBO_3D_VINHETA      = true              # escurece cantos, mantém centro claro
# GLOBO_3D_ATMOSFERA    = true              # halo azul ao redor do globo (s39)
# GLOBO_3D_ISOTERMA_0C        = true       # isoterma de 0°C absoluta em 850 hPa (s38 e s39)
# GLOBO_3D_CONTORNO_Z250_ANOM   = true     # isolinhas brancas da anomalia de geopotencial 250 hPa (s38 e s39)
# Caixa de texto LIVRE (anotação lat/lon, fade-in perto do fim; mesma fonte do título):
# GLOBO_3D_CAIXA_LIVRE          = true
# GLOBO_3D_CAIXA_LIVRE_LAT      = -12.0
# GLOBO_3D_CAIXA_LIVRE_LON      = -150.0
# GLOBO_3D_CAIXA_LIVRE_TEXTO    = "Ventos alísios enfraquecendo"
# GLOBO_3D_CAIXA_LIVRE_COR_BOX  = "red"
# GLOBO_3D_CAIXA_LIVRE_COR_TEXTO = "white"
# GLOBO_3D_CAIXA_LIVRE_CONTORNO_COR = "white"
# GLOBO_3D_CAIXA_LIVRE_CONTORNO_LW  = 1.5
# GLOBO_3D_CAIXA_LIVRE_FONTSIZE = 14.0
# GLOBO_3D_CAIXA_LIVRE_LARGURA  = 22       # quebra automática (caracteres; 0 = sem)
# GLOBO_3D_CAIXA_LIVRE_INICIO   = 0.80     # fração do clipe onde começa o fade-in
# GLOBO_3D_CAIXA_LIVRE_FADE     = 0.12     # duração do fade-in
# GLOBO_3D_CAIXA_LIVRE_ALPHA_MAX = 1.0     # opacidade final (1.0 = caixa OPACA)
# GLOBO_3D_CAIXA_LIVRE_SOMBRA   = true     # sombra preta esfumaçada ao redor (realça a borda branca)
# GLOBO_3D_ISOL_HGT250_ABS      = false   # isolinhas de geopotencial absoluto 250 hPa sobre QUALQUER campo (baixa Z250 dedicado)
# GLOBO_3D_ISOL_HGT250_INTERVALO = 60     # intervalo entre isolinhas absolutas de Z250 (mgp)
# GLOBO_3D_ISOL_HGT250_COR      = "#666666"  # cor dessas isolinhas sobre campo estranho (ex.: "black")
# GLOBO_3D_VMIN_JET_STREAM     = 30.0     # jet_stream: abaixo deste valor = transparente (ms⁻¹)
# GLOBO_3D_VMAX_JET_STREAM     = 90.0     # jet_stream: maximo da escala de cores (ms⁻¹)
# GLOBO_3D_ISOL_HGT_JET_STREAM = false    # isolinhas de Z250 clim. sobrepostas ao jet stream
# GLOBO_3D_MSLP_INTERVALO      = 3.0     # intervalo das isolinhas de PNMM (hPa)
# GLOBO_3D_MSLP_COR            = "black" # cor das isolinhas de PNMM (passado ERA5 + previsao GEFS)
# GLOBO_3D_MSLP_LW             = 0.5     # espessura das isolinhas de PNMM
# GLOBO_3D_MSLP_SIGMA          = 2.0     # suavização gaussiana (0 = desliga)
# GLOBO_3D_FONTE_TITULO  = "Aptos Display" # fonte do título (nome ou arquivo .ttf)
# GLOBO_3D_FONTE_LEGENDA = "Aptos Display" # fonte da legenda

# ── 5d-quater. s41 (padrão Google Earth): knobs PRÓPRIOS (só s41; sem eles herda o s39) ──
# GLOBO_3D_PROJECTION_S41 = "google_earth"  # projeção do s41 ("nearside"/"orthographic" p/ igual s39)
# GLOBO_3D_GE_ALTURA      = 5000000         # ZOOM: altura da câmera (m); MENOR = mais perto = continente maior
# Quadro PAISAGEM (referência): globo GRANDE preenchendo a largura, centro do disco baixo (desce o globo).
# GLOBO_3D_GE_ASPECT      = 0.62            # altura/largura do quadro (<1 = paisagem; menor = mais largo/baixo)
# GLOBO_3D_GE_GLOBO_FRAC  = 1.02            # diâmetro do disco como fração da LARGURA do quadro (>=1 preenche)
# GLOBO_3D_GE_GLOBO_CY    = 0.29            # posição vertical do CENTRO do disco (0=base,1=topo; MENOR = desce mais)
# GLOBO_3D_GE_INCLINACAO  = ""              # corte HS/HN: >0 mais Norte; <0 mais Sul; 0 equador; ""=varia no voo
# Câmera FIXA na América do Sul (default reproduz o print de referência); inicial==final => sem voo.
# GLOBO_3D_GE_LON_INICIAL  = -58.0
# GLOBO_3D_GE_LAT_INICIAL  = -17.0
# GLOBO_3D_GE_LON_FINAL    = -58.0
# GLOBO_3D_GE_LAT_FINAL    = -17.0
# GLOBO_3D_GE_VOLTAS_EXTRA = 0.0
# GLOBO_3D_GE_EASING       = "ease_in_out"
# GLOBO_3D_GE_FRAMES_POR_DIA = 5
# GLOBO_3D_GE_FPS            = 8
# GLOBO_3D_GE_VELOCIDADE_VAR = 1.0
# ── s41: TRÊS SAÍDAS por variável (MP4 do período + PNG da média + GIF da média) ──
# O s41 gera, por variável: MP4 (voo+evolução, SEM jato), PNG da MÉDIA do período (+ jato PARADO) e
# GIF da MÉDIA (campo fixo + 'JET STREAM'/setas animando W->E). O jato aparece no PNG e no GIF.
# GLOBO_3D_GE_GIF_FRAMES  = 48       # nº de frames do loop do GIF (mais = mais suave)
# GLOBO_3D_GE_GIF_FPS     = 12       # fps do GIF (velocidade das setas)

# ── s38/s39/s40/s41: CORRENTES DE JATO (MASTER ÚNICO p/ os 4 globos; QUALQUER campo, TODA saída) ── ref. JETSTREAM.png + seta.png
# Dois jatos INDEPENDENTES (JET_STREAM azul + SUBTROPICAL_JET verde), cada um com NÍVEL/COR/TEXTO
# próprios; o resto do estilo é compartilhado. Espaçamento texto<->setas é AUTOMÁTICO (adapta ao texto).
# GLOBO_3D_JATO            = true       # master liga a(s) corrente(s) de jato nos 4 globos
# GLOBO_3D_JATO_HEMISFERIO_SUL   = true # desenha o jato no HEMISFERIO SUL (lat < 0)
# GLOBO_3D_JATO_HEMISFERIO_NORTE = true # desenha o jato no HEMISFERIO NORTE (lat > 0); ao olhar o HS, deixe false
# GLOBO_3D_JATO_MP4_CAUDA_SEG = 7.0     # MP4: apos a animacao da variavel, N seg com o campo CONGELADO e o jato ainda FLUINDO (0 = sem cauda)
# GLOBO_3D_FADE_IN_SEG       = 0.0      # MP4: sai do preto no comeco do video nos primeiros N seg (0 = desligado)
# GLOBO_3D_FADE_OUT_SEG      = 0.0      # MP4: escurece a tela ate o preto nos ultimos N seg (0 = desligado), pro video nao terminar seco
# GLOBO_3D_FADE_OUT_HOLD_SEG = 0.4      # MP4: segundos segurando no preto no fim do fade-out
# Jato em QUALQUER campo e em TODA saida (MP4/PNG/GIF). Baixa Z250 (ERA5/GDAS + modelos); se faltar, avisa e segue sem jato.
# --- Jato 1: JET STREAM (polar, azul) ---
# GLOBO_3D_JET_STREAM            = true
# GLOBO_3D_JET_STREAM_NIVEL      = 10200        # mgp: isolinha de Z250 (eixo deste jato)
# GLOBO_3D_JET_STREAM_COR        = "#1787ad"    # azul
# GLOBO_3D_JET_STREAM_TEXTO      = "JET STREAM"  # texto animado (qualquer string)
# GLOBO_3D_JET_STREAM_VELOCIDADE = 1.0          # velocidade do fluxo (GIF: espac./loop; MP4: espac./s)
# --- Jato 2: SUBTROPICAL JET (verde) ---
# GLOBO_3D_SUBTROPICAL_JET            = false
# GLOBO_3D_SUBTROPICAL_JET_NIVEL      = 10600        # mgp (subtropical = + alto)
# GLOBO_3D_SUBTROPICAL_JET_COR        = "#2e8b57"    # verde
# GLOBO_3D_SUBTROPICAL_JET_TEXTO      = "SUBTROPICAL JET"
# GLOBO_3D_SUBTROPICAL_JET_VELOCIDADE = 1.0          # velocidade do fluxo deste jato
# --- Estilo COMPARTILHADO ---
# GLOBO_3D_JATO_ALPHA         = 1.0        # opacidade da faixa central
# GLOBO_3D_JATO_STRIPE_ALPHA   = 0.35      # opacidade das faixas finas
# GLOBO_3D_JATO_STRIPE_N       = 3         # faixas finas por lado
# GLOBO_3D_JATO_STRIPE_GAP0    = 1.0       # graus: deslocamento da 1a faixa fina
# GLOBO_3D_JATO_STRIPE_GAP     = 0.7       # graus: espaçamento entre faixas finas
# GLOBO_3D_JATO_SETAS_ENTRE = 2           # nº de setas entre palavras (ref. = 2)
# GLOBO_3D_JATO_SETAS_PASSO = 6.0         # graus entre setas (define o espaço; texto nunca sobrepõe)
# GLOBO_3D_JATO_ARROW_COR   = "white"     # cor das setas
# GLOBO_3D_JATO_TEXTO_COR   = "white"     # cor do texto
# GLOBO_3D_JATO_TEXTO_MAX_CURVA = 110.0   # graus: só pula a palavra em curva EXTREMA
# GLOBO_3D_JATO_MIN_PTS       = 12        # min. de pontos p/ desenhar um segmento
# GLOBO_3D_JATO_LAT_MIN       = 15.0      # banda de |lat| do jato: mínimo
# GLOBO_3D_JATO_LAT_MAX       = 60.0      # banda de |lat| do jato: máximo
# (tela/pt) GLOBO_3D_JATO_LARGURA=16.0  _STRIPE_LARGURA=3.0  _ARROW_TAM=12.0  _TEXTO_TAM=11.0
# DRAPE: jato "colado" na superfície (perspectiva 3D correta). No modo drape os tamanhos vão em GRAUS.
# GLOBO_3D_JATO_DRAPE            = true    # liga o jato drapejado na superfície
# GLOBO_3D_JATO_DRAPE_PX         = 5000    # resolução do raster plano (texto + nítido / + lento)
# GLOBO_3D_JATO_DRAPE_REGRID     = 2048    # resolução da reprojeção p/ a esfera
# GLOBO_3D_JATO_DRAPE_PAD        = 6.0     # graus de folga em lat ao redor da banda
# GLOBO_3D_JATO_LARGURA_DEG      = 2.2     # (drape) espessura da faixa central em graus de lat
# GLOBO_3D_JATO_STRIPE_LARGURA_DEG = 0.5   # (drape) espessura das faixas finas em graus
# GLOBO_3D_JATO_TEXTO_TAM_DEG    = 1.7     # (drape) altura do texto em graus
# GLOBO_3D_JATO_ARROW_TAM_DEG    = 2.4     # (drape) tamanho das setas em graus

# ── 5d-ter. s40 (figuras estáticas): câmera fixa + mínimo de dias p/ media_movel/pentadas ──
# Posição/inclinação do globo estático = ORTHO_CENTRAL_LONGITUDE/LATITUDE (não o voo do s38/s39).
# GLOBO_3D_ESTATICO_LON      = -45.0   # override; sem isso usa ORTHO_CENTRAL_LONGITUDE
# GLOBO_3D_ESTATICO_LAT      = -15.0   # override; sem isso usa ORTHO_CENTRAL_LATITUDE
# GLOBO_3D_ESTATICO_MIN_DIAS = 5       # < isso: pula media_movel E pentadas_fixas (sem erro/pasta)

# ── 5e. Escala de cores — global ─────────────────────────────────────────
# GLOBO_3D_NIVEIS = 16   # bandas de cor: menos = mais contraste; mais = degradê mais suave

# ── 5d-bis. Robustez: dias com anomalia degenerada (dado parcial no download) ──
# GLOBO_3D_DIA_DEGEN_FRAC        = 0.02   # limiar ABSOLUTO (fracao minima do sinal minoritario)
# GLOBO_3D_DIA_DEGEN_REL         = 0.5    # RELATIVO: dia < 0.5x a mediana da serie = parcial
# GLOBO_3D_SKIP_DIAS_DEGENERADOS = true   # true = pula dias ruins; false = so avisa

# ── 5f. Escala de cores — overrides POR VARIÁVEL ─────────────────────────
# GLOBO_3D_NIVEIS_Z250_ANOM    = 50    # bandas do z250   (default na ficha: 50)
# GLOBO_3D_NIVEIS_TMP850_ANOM  = 128   # bandas do tmp850 (default na ficha: 128)
#
# Range ±mgp do z250: menor = mais cinza nos trópicos; maior = menos cinza
#   Sugestão: 150 (muito cinza) | 200 (moderado, padrão) | 250 (pouco cinza)
# GLOBO_3D_VMAX_Z250_ANOM = 200
# GLOBO_3D_VMAX_OLR_ANOM  = 60.0   # escala maxima da anomalia de OLR (W/m²); default 60
# GLOBO_3D_SIGMA_OLR_ANOM = 1.5    # suavizacao gaussiana do campo OLR (0 = desliga); default 1.5

# ── 5g. Paleta de cores por variável (sobrescreve a paleta da ficha) ──────
# GLOBO_3D_PALETA_Z250_ANOM   = ["#8A83A2", "#6656AC", ..., "#CF5A96"]
# GLOBO_3D_PALETA_TMP850_ANOM = ["#a30d92", "#720669", ..., "#3d3d3d"]

# ── 5h. Rótulos do degradê (s39 Guillaume — do extremo negativo ao positivo)
# GLOBO_3D_LEGENDA5 = ["Muito abaixo", "Abaixo", "Na média", "Acima", "Muito acima"]


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  6. ÁREAS DE PLOTAGEM POR SCRIPT                                        │
# └─────────────────────────────────────────────────────────────────────────┘
# Sobrescreva a lista de áreas para um script específico.
# Deixe comentado para usar o padrão do settings.toml.

# LST_AREAS_S01 = [
