# s31 — CHI200 intrasazonal / MJO ─────────────────────────────────────────
# JANELA_MEDIA_MOVEL = 120   # dias da média móvel removida (padrão CPC)
# N_PENTADAS         = 6     # quantas pentadas de mapas gerar
# HOVMOLLER_DIAS     = 120   # extensão temporal do Hovmoller
# WW_EXTRA_JANELA    = 0     # 0 = separação MJO/Kelvin imprecisa; 270 = precisa

# s33 — Hovmoller de caixa livre (TSM + vento zonal 850 hPa) ─────────────
# HOV_FREE_LAT_MIN = -5.0
# HOV_FREE_LAT_MAX =  5.0
# HOV_FREE_LON_MIN = 160.0   # cruza antimeridiano se LON_MIN > LON_MAX
# HOV_FREE_LON_MAX = -80.0
# HOV_FREE_NOME    = "Caixa Livre"
# HOV_FREE_MAP_PAD = 10.0    # padding (graus) ao redor da caixa no mapa

# s34 — Guia de onda de Rossby (Ks 200 hPa + v'200) ──────────────────────
# WGUIDE_SMOOTH_DEG              = 5.0    # suavização (graus) antes da 2ª derivada
# WGUIDE_HOV_SUBTROPICAL_LAT_MIN = -45.0
# WGUIDE_HOV_SUBTROPICAL_LAT_MAX = -20.0
# WGUIDE_HOV_POLAR_LAT_MIN       = -60.0
# WGUIDE_HOV_POLAR_LAT_MAX       = -40.0

# s35 — Índice AAO / heatmap de desempenho ────────────────────────────────
# AAO_HIST_DAYS           = 30    # dias de observado antes das previsões
# S35_HEATMAP             = true
# S35_HEATMAP_WINDOW_DAYS = 60
# S35_HEATMAP_LEAD_LO     = 5
# S35_HEATMAP_LEAD_HI     = 10
# S35_BACKFILL            = false  # preenche histórico via AWS S3 (one-off, pesado)
# S35_BACKFILL_DAYS       = 60
# S35_BACKFILL_LEAD_DAYS  = 16

# s36 — Índice MJO / RMM ──────────────────────────────────────────────────
# MJO_HIST_DAYS = 40   # dias de observado na trajetória do diagrama de fase

# s37 — Heatmap de frentes frias (limiares de detecção) ───────────────────
# FRENTE_DV_MIN       = 2.0   # |Δv| mínimo em 6 h (giro do vento p/ sul)
# FRENTE_DTEMP_MIN    = 1.0   # queda mínima da média diária de T2m (°C)
# FRENTE_REFRACTORY_H = 48    # período refratário por localidade (h)


