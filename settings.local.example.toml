    "globo_3d",
]

# Configuracao de quiver do CHI200 por area (exemplo):
# [default.CHI200_QUIVER_POR_AREA.tropico]
# scale = 80
# width = 0.002
# step = 10
# min_mag = 0.3
# headwidth = 3.5
# headlength = 4.5
# color = "black"

# s33 - Hovmoller de caixa livre (TSM + vento zonal 850 hPa).
# Defina qualquer caixa do mundo. Convencao de longitude: -180..180 (Leste positivo);
# se LON_MIN > LON_MAX a caixa cruza o antimeridiano (ex: 160 e -80 = 160E..80W).
# Latitudes -> titulo da figura | Longitudes -> eixo X do Hovmoller.
# HOV_FREE_LAT_MIN = -5.0
# HOV_FREE_LAT_MAX = 5.0
# HOV_FREE_LON_MIN = 160.0
# HOV_FREE_LON_MAX = -80.0
# HOV_FREE_NOME = "Caixa Livre"
# HOV_FREE_MAP_PAD = 10.0   # padding (graus) ao redor da caixa no mapa de quiver

# s34 - Guia de onda de Rossby: numero de onda estacionario Ks 200 hPa + v'200.
# Areas dos mapas: LST_AREAS_S34 (padrao s07). Settings abaixo: dois Hovmollers (jato sub + polar HS).
# WGUIDE_SMOOTH_DEG = suavizacao (graus) do escoamento basico antes da 2a derivada.
# WGUIDE_SMOOTH_DEG = 5.0
# WGUIDE_HOV_SUBTROPICAL_LAT_MIN = -45.0
# WGUIDE_HOV_SUBTROPICAL_LAT_MAX = -20.0
# WGUIDE_HOV_POLAR_LAT_MIN = -60.0
# WGUIDE_HOV_POLAR_LAT_MAX = -40.0

