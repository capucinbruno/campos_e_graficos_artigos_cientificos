# ══════════════════════════════════════════════════════════════════════════════
# settings.local.example.toml  —  TEMPLATE DE OVERRIDES PESSOAIS
# ══════════════════════════════════════════════════════════════════════════════
# Copie este arquivo para  settings.local.toml  (gitignored).
# Descomente e ajuste APENAS o que quiser mudar.
# Tudo que não estiver aqui herda o valor padrão de app/settings/settings.toml.
# ══════════════════════════════════════════════════════════════════════════════

# [default]


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  1. PERÍODO DE INTERESSE                                                │
# └─────────────────────────────────────────────────────────────────────────┘
# Datas inclusivas no formato YYYY-MM-DD.
# O ERA5 tem ~5 dias de atraso; DATA_FINAL muito recente causa erro no CDS.

# DATA_INICIAL = "2026-05-29"
# DATA_FINAL   = "2026-06-04"


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  2. QUAIS SCRIPTS RODAR  (--all)                                        │
# └─────────────────────────────────────────────────────────────────────────┘
# Por padrão todos estão habilitados. Descomente a linha para desabilitar.
# Nenhum script registrado ainda — veja GUIA-NOVOS-SCRIPTS.md.

# RUN_SNN = false


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  3. DIRETÓRIOS  (raramente necessário mudar)                            │
# └─────────────────────────────────────────────────────────────────────────┘

# DIR_DADOS  = "dados"    # onde os .nc/.grb baixados do CDS ficam
# DIR_OUTPUT = "Saida"    # onde os PNGs/MP4s são salvos
# DIR_INPUT  = "Entrada"  # arquivos fixos (legendas, climatologias)


# ══════════════════════════════════════════════════════════════════════════════
# AMBIENTE  (overrides por ambiente — raramente necessário)
# ══════════════════════════════════════════════════════════════════════════════

# [development]
# Scripts a desabilitar somente em desenvolvimento:
# RUN_SNN = false

# [production]
# Scripts a desabilitar somente em produção (servidor Oracle):
# RUN_SNN = false
