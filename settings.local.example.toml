# Copie para settings.local.toml e ajuste (gitignored)

[default]

# Periodo de interesse para download e processamento
DATA_INICIAL = "2026-05-29"
DATA_FINAL = "2026-06-04"

# Diretorio para dados baixados do CDS (sobrescreva se necessario)
# DIR_DADOS = "dados"

# Arquivos de suporte (sobrescreva para usar outro caminho/arquivo)
# FILE_CLIMATOLOGIA_VENTO100M = "Entrada/arquivos_nc/climatologia_1991_2020_vento100m_ERA5.nc"
# REMOTE_CLIMATOLOGIA_VENTO100M = "/home/ubuntu/resources/.../climatologia_vento100m.nc"
# FILE_CLIMATOLOGIA_GEOP250 = "Entrada/arquivos_nc/hgt250_clim_1995_2024.nc"
# REMOTE_CLIMATOLOGIA_GEOP250 = "/home/ubuntu/resources/.../hgt250_clim_1995_2024.nc"

# Climatologia diaria OISST (LTM 1991-2020) — base da anomalia de TSM do s12
# FILE_CLIMATOLOGIA_SST = "Entrada/sst.day.mean.ltm.1991-2020.nc"

# Climatologias vento 250 hPa (sobrescreva para usar outro caminho/arquivo)
# FILE_CLIMATOLOGIA_UWND250 = "Entrada/arquivos_nc/uwnd250_clim_1995_2024.nc"
# REMOTE_CLIMATOLOGIA_UWND250 = "/home/ubuntu/resources/.../uwnd250_clim_1995_2024.nc"
# FILE_CLIMATOLOGIA_VWND250 = "Entrada/arquivos_nc/vwnd250_clim_1995_2024.nc"
# REMOTE_CLIMATOLOGIA_VWND250 = "/home/ubuntu/resources/.../vwnd250_clim_1995_2024.nc"

# Logo nos mapas — somente um deve ser true (SEM_LOGO tem prioridade)
# LOGO_AMPERE = true   # Entrada/novo_logo.png
# LOGO_GREC = false    # Entrada/logo_grec.png
# SEM_LOGO = false     # sem logo em nenhum mapa

# Projeção ortográfica do globo 3D (globo_3d) — centro da câmera
# ORTHO_CENTRAL_LONGITUDE = -71
# ORTHO_CENTRAL_LATITUDE = -84

# s31 — filtro Wheeler-Weickmann (onda de Kelvin)
# Para separação MJO/Kelvin precisa, aumente para 270 dias e baixe os arquivos ERA5
# de Jan-Ago/2025 (8 arquivos x ~34 MB = ~272 MB). Isso aumenta chi_intra de 122d
# para ~420d, dando 28 modos Kelvin k=2 vs 8 modos com o padrão (0).
# WW_EXTRA_JANELA = 270

# Áreas de plotagem do s01 (chaves de areas_plotagem no settings.json)
# Edite para mudar quais áreas o s01 gera
LST_AREAS_S01 = [
    "pacific_chile",
    "china",
    "pacifico_leste_america_sul",
    "america_sul_zom_out",
    "MDR",
    "tropico",
    "zona_zcit_atlantico",
    "brasil",
    "america_sul",
    "africa_monsoon",
    "africa",
    "mjo",
    "amo",
    "sad",
    "iod",
    "pdo",
    "tna",
    "tsa",
    "atlantico_tropical",
    "enso",
    "globo",
    "costa_brasil",
    "psa",
    "argentina",
    "estados_unidos_zoom",
    "estados_unidos",
