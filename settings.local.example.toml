# Configuracao de quiver do CHI200 por area (exemplo):
# [default.CHI200_QUIVER_POR_AREA.tropico]
# scale = 80
# width = 0.002
# step = 10
# min_mag = 0.3
# headwidth = 3.5
# headlength = 4.5
# color = "black"

# s33 - Hovmoller de caixa livre (TSM + vento zonal 850 hPa).
# Defina qualquer caixa do mundo. Convencao de longitude: -180..180 (Leste positivo);
# se LON_MIN > LON_MAX a caixa cruza o antimeridiano (ex: 160 e -80 = 160E..80W).
# Latitudes -> titulo da figura | Longitudes -> eixo X do Hovmoller.
# HOV_FREE_LAT_MIN = -5.0
# HOV_FREE_LAT_MAX = 5.0
# HOV_FREE_LON_MIN = 160.0
# HOV_FREE_LON_MAX = -80.0
# HOV_FREE_NOME = "Caixa Livre"
# HOV_FREE_MAP_PAD = 10.0   # padding (graus) ao redor da caixa no mapa de quiver

# s34 - Guia de onda de Rossby: numero de onda estacionario Ks 200 hPa + v'200.
# Areas dos mapas: LST_AREAS_S34 (padrao s07). Settings abaixo: dois Hovmollers (jato sub + polar HS).
# WGUIDE_SMOOTH_DEG = suavizacao (graus) do escoamento basico antes da 2a derivada.
# WGUIDE_SMOOTH_DEG = 5.0
# WGUIDE_HOV_SUBTROPICAL_LAT_MIN = -45.0
# WGUIDE_HOV_SUBTROPICAL_LAT_MAX = -20.0
# WGUIDE_HOV_POLAR_LAT_MIN = -60.0
# WGUIDE_HOV_POLAR_LAT_MAX = -40.0

# Modo de dados (piloto no s34): "reanalysis" (datas, ERA5/GDAS) ou "forecast" (modelos).
# Em "forecast", as datas sao ignoradas: usa o ciclo FORECAST_INIT + GEFS_FORECAST_LEAD_DAYS.
# MODE = "forecast"
# Modelos de previsao: habilite um ou mais. O s34 roda para CADA modelo habilitado e salva
# em Saida/<MODELO>/. GFS = deterministico 0.25°; GEFS = media do ensemble 0.5°;
# ECMWF = HRES deterministico 0.25° (open data; OLR derivado de ttr; ate 15 dias).
# RUN_GFS = false
# RUN_GEFS = true
# RUN_ECMWF = false
# RUN_ECMWF_ENS = false          # media dos 50 membros do ENS (PESADO: ~50 downloads/campo/passo)
# RUN_AIFS = false               # IA deterministica do ECMWF (15d) — SEM OLR (gera 4 dos 5 mapas)
# RUN_AIFS_ENS = false           # IA ensemble do ECMWF (media 50 membros, SEM OLR — PESADO)
# RUN_AIGFS = false              # IA deterministica do NCEP/NOMADS (16d) — SEM OLR (4 mapas)
# RUN_AIGEFS = false             # IA ensemble do NCEP (media `avg` pronta, 16d, SEM OLR — LEVE)
# ECMWF_ENS_MEMBERS = 50         # nº de membros a mediar (reduza p/ acelerar; 20 ~ ok)
# ECMWF_ENS_WORKERS = 48         # downloads de membros em paralelo (ECMWF S3 escala; ate ~64)
# DOWNLOAD_WORKERS = 6           # dias de previsao baixados em paralelo (1 = sequencial)
# Data da rodada: deixe vazio ("") ou "latest" para a DATA ATUAL (ciclo mais recente).
# Para uma rodada ANTIGA, digite a DATA no formato ISO "YYYY-MM-DD" (ex.: "2026-06-10");
# a hora do ciclo vem da RODADA abaixo. (Tambem aceita o timestamp "YYYYMMDDHH".)
# FORECAST_INIT = ""              # "" / "latest" = hoje; ou "YYYY-MM-DD" para rodada antiga
# GEFS_FORECAST_LEAD_DAYS = 35    # horizonte SO do GEFS: 15 -> rodada 00Z de hoje; 35 -> 00Z de D-1.
#                                 # CFS = 45 dias fixo; demais modelos (GFS/ECMWF/AIFS...) ~16d fixo.
# Pentadas do s34: em FORECAST auto-cobrem o horizonte de cada modelo (CFS 9, GEFS 35d->7, 15d->3).
# N_PENTADAS_FIXAS so vale em REANALISE (override do N_PENTADAS).
# RODADA = "00"                   # hora do ciclo (2 digitos): "00", "06", "12" ou "18" UTC
#   Subsazonal GEFS 35d: MODE="forecast", RUN_GEFS=true, RODADA="00", GEFS_FORECAST_LEAD_DAYS=35
# NUM_RODADA = 1                  # n. de rodadas diarias dessa hora (lagged ensemble)
# s31 forecast (CHI200 MJO): GEFS (35d) e CFS (45d) SEMPRE rodam, cada um em sua pasta. O CFS usa
# o pseudo-ensemble lagged do NCICS (16 membros = 4 ciclos x 4); dia D = ONTEM (FORECAST_INIT vazio).
# CFS_LEAD_DAYS = 45              # horizonte do CFS (piso dos 16 membros = janela do NCICS)
# CFS_WORKERS = 8                # downloads de membros do CFS em paralelo (NOMADS)
# Mapas espaciais do s31 forecast: medias de N dias em janelas consecutivas a partir de init
# (estilo "Select Days" do NCICS). Cada tamanho vai em <MODELO>/<N>_DAY/. Menos itens = menos figuras.
# FORECAST_MAP_WINDOWS = [1, 2, 3, 5, 7, 10]
# MOV_AVG_DAYS = 5                # janela movel (dias) dos MAPAS espaciais (Hovmoller nao usa)
# AAO_HIST_DAYS = 120             # s35 (indice AAO): dias de observado plotados antes das previsoes
# MJO_HIST_DAYS = 40              # s36 (indice MJO/RMM): dias de observado na trajetoria do diagrama de fase
# RUN_S36 = false                 # descomente para desativar o s36 (indice MJO) no --all
# RUN_S37 = false                 # descomente para desativar o s37 (heatmap de frentes frias) no --all
# Limiares de deteccao de frente fria (s37) — calibraveis:
# FRENTE_DV_MIN = 2.0             # |Delta v| minimo em 6h (giro do vento p/ sul, Simmonds)
# FRENTE_DTEMP_MIN = 1.0          # queda minima da media diaria de T2m (guarda termica, em C)
# FRENTE_REFRACTORY_H = 48        # periodo refratario por localidade (1 frente = 1 contagem)
# RUN_S38 = false                  # descomente para desativar o s38 (globo 3D animado) no --all
# s38 (globo 3D animado / midia MP4) — variavel, modo e voo da camera:
# VARIAVEL_GLOBO_3D = "z250_anom"  # chave do registro (app/src/uteis/globo_3d_anim.py)
# GLOBO_3D_MODO = "reanalise"      # "reanalise" (ERA5/GDAS) ou "forecast" (RUN_GFS/RUN_GEFS/RUN_ECMWF/RUN_AIFS)
# GLOBO_3D_LON_INICIAL = -150.0    # voo: ponto inicial (meio do Pacifico)
# GLOBO_3D_LAT_INICIAL = 0.0
# GLOBO_3D_LON_FINAL = -45.0       # voo: ponto final (costa do Brasil)
# GLOBO_3D_LAT_FINAL = -15.0
# GLOBO_3D_INCLINACAO = ""          # inclinacao fixa do globo: >0 mais HN, <0 mais HS; ""=usa LAT_INICIAL/FINAL
# GLOBO_3D_VOLTAS_EXTRA = 0.0      # giros completos extras antes de assentar (aumenta a velocidade)
# GLOBO_3D_EASING = "linear"       # perfil de velocidade: "linear"|"ease_out"(desacelera no fim)|"ease_in"|"ease_in_out"
# GLOBO_3D_VELOCIDADE_VAR = 1.0     # velocidade da variavel animada (1=normal; 2=2x; 0.5=metade) — independe do voo
# GLOBO_3D_FRAMES_POR_DIA = 4      # + frames = voo mais lento e suave (interpola o tempo tambem)
# GLOBO_3D_FPS = 20                # quadros por segundo do MP4
# GLOBO_3D_GRID_DEG = 0.5          # resolucao do dado plotado (0.25 max detalhe; 0.5 detalhado; 2.5 suave)
# GLOBO_3D_NIVEIS = 16             # bandas de cor discretas (menos = mais contraste/bandas)
# GLOBO_3D_FONTE_TITULO = "Aptos Display"  # fonte do titulo (.ttf em Entrada/fonts/)
# GLOBO_3D_FONTE_LEGENDA = "Aptos Display" # fonte do CBAR (.ttf em Entrada/fonts/)
# GLOBO_3D_TAMANHO_PX = 1080               # resolucao do video (1080 = retina)
# GLOBO_3D_WORKERS = 0                      # nucleos no render paralelo (0 = todos)
# GLOBO_3D_COARSEN = 1             # subamostragem extra (1 = nenhuma)
# GLOBO_3D_PROJECTION = "nearside" # "nearside" (globo flutuante) ou "orthographic"
# GLOBO_3D_CREDITO = "Bruno Capucin" # autor no rodape direito (esquerdo = Reanálise/nome do modelo)
# GLOBO_3D_VINHETA = true            # vinheta (cantos escuros, centro claro)

